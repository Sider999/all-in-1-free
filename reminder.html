<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task & Event Reminder Suite - MultiTools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">⚡ MultiTools Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="calculator.html">Calculator</a></li>
      <li><a href="currency-converter.html">Currencies</a></li>
      <li><a href="reminder.html" class="active">Reminders</a></li>
      <li><a href="document-tools.html">PDF & Word</a></li>
      <li><a href="image-tools.html">Image Tools</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="tool-box">
      <h2 class="tool-title">Advanced Task & Multi-Channel Reminder</h2>

      <label>Task Title / Subject:</label>
      <input type="text" id="taskTitle" placeholder="e.g. Server Renewal Payment">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>Due Date & Time:</label>
          <input type="datetime-local" id="taskDate">
        </div>
        <div>
          <label>Recurrence / Repeat Option:</label>
          <select id="taskRepeat">
            <option value="Single Event">Single Event (No Repeat)</option>
            <option value="Every 2 Days">Every 2 Days</option>
            <option value="Every 3 Days">Every 3 Days</option>
            <option value="Every 5 Days">Every 5 Days</option>
            <option value="Every 7 Days">Every 7 Days (Weekly)</option>
            <option value="Every 15 Days">Every 15 Days</option>
            <option value="Every 30 Days">Every 30 Days (Monthly)</option>
          </select>
        </div>
      </div>

      <label>Target Phone Number (For WhatsApp / SMS Alerts):</label>
      <input type="text" id="taskPhone" placeholder="e.g. +923001234567">

      <label>Target Email Address (For Email Alerts):</label>
      <input type="email" id="taskEmail" placeholder="e.g. client@example.com">

      <button class="btn btn-success" style="margin-top: 15px;" onclick="saveTask()">➕ Add & Save Task</button>

      <div style="margin-top: 35px;">
        <h3>Saved Reminders List</h3>
        <div id="taskList" style="margin-top: 15px;"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 MultiTools Portal</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", loadTasks);

    function saveTask() {
      let title = document.getElementById('taskTitle').value.trim();
      let date = document.getElementById('taskDate').value;
      let repeat = document.getElementById('taskRepeat').value;
      let phone = document.getElementById('taskPhone').value.trim();
      let email = document.getElementById('taskEmail').value.trim();

      if (!title || !date) {
        alert("Please enter both Task Title and Date/Time!");
        return;
      }

      let tasks = JSON.parse(localStorage.getItem('portal_tasks') || '[]');
      tasks.push({ id: Date.now(), title, date, repeat, phone, email });
      localStorage.setItem('portal_tasks', JSON.stringify(tasks));

      document.getElementById('taskTitle').value = '';
      loadTasks();
    }

    function loadTasks() {
      let tasks = JSON.parse(localStorage.getItem('portal_tasks') || '[]');
      let container = document.getElementById('taskList');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">No active tasks found. Create one above!</p>';
        return;
      }

      tasks.forEach(t => {
        let waText = encodeURIComponent(`⏰ REMINDER ALERT: ${t.title}\nDue Date: ${t.date}\nRepeat Cycle: ${t.repeat}`);
        let waUrl = t.phone ? `https://wa.me/${t.phone.replace(/[^0-9]/g, '')}?text=${waText}` : `https://wa.me/?text=${waText}`;
        let smsUrl = `sms:${t.phone}?body=${waText}`;
        let mailUrl = `mailto:${t.email}?subject=${encodeURIComponent("Task Reminder: " + t.title)}&body=${waText}`;

        let div = document.createElement('div');
        div.style.cssText = "background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px;";
        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;">
            <div>
              <h4 style="color: #38bdf8; font-size: 1.1rem;">${t.title}</h4>
              <p style="font-size: 0.85rem; color: #94a3b8; margin: 4px 0;">📅 Due: <b>${t.date.replace('T', ' ')}</b> | 🔁 Interval: <b>${t.repeat}</b></p>
            </div>
            <button class="btn btn-danger" style="width: auto; padding: 4px 10px; font-size: 0.8rem;" onclick="deleteTask(${t.id})">Delete</button>
          </div>
          <div class="btn-group">
            <a href="${waUrl}" target="_blank" class="btn btn-whatsapp" style="width: auto; padding: 6px 12px; font-size: 0.85rem;">💬 WhatsApp Alert</a>
            <a href="${smsUrl}" class="btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; background: #0284c7;">📱 SMS Alert</a>
            <a href="${mailUrl}" class="btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; background: #7c3aed;">✉️ Email Alert</a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteTask(id) {
      let tasks = JSON.parse(localStorage.getItem('portal_tasks') || '[]');
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem('portal_tasks', JSON.stringify(tasks));
      loadTasks();
    }
  </script>
</body>
</html>
