<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF & Word Document Suite - MultiTools</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Load Powerful Client-Side Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">⚡ MultiTools Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="calculator.html">Calculator</a></li>
      <li><a href="currency-converter.html">Currencies</a></li>
      <li><a href="reminder.html">Reminders</a></li>
      <li><a href="document-tools.html" class="active">PDF & Word</a></li>
      <li><a href="image-tools.html">Image Tools</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="tool-box">
      <h2 class="tool-title">PDF & Word Document Operations</h2>

      <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('merge')">PDF Merger</button>
        <button class="tab-btn" onclick="switchTab('img2pdf')">Image to PDF</button>
        <button class="tab-btn" onclick="switchTab('pdf2img')">PDF to Image</button>
        <button class="tab-btn" onclick="switchTab('word2pdf')">Word / Text to PDF</button>
      </div>

      <!-- PDF MERGER -->
      <div id="tab-merge" class="tab-content">
        <h3>Merge Multiple PDF Files</h3>
        <label>Select Multiple PDFs (in order):</label>
        <input type="file" id="mergeInput" accept="application/pdf" multiple>
        <button class="btn" onclick="processPDFMerge()">Merge PDFs & Download</button>
      </div>

      <!-- IMAGE TO PDF -->
      <div id="tab-img2pdf" class="tab-content" style="display: none;">
        <h3>Convert Images to PDF Document</h3>
        <label>Select JPG/PNG Images:</label>
        <input type="file" id="img2PdfInput" accept="image/*" multiple>
        <button class="btn" onclick="processImgToPDF()">Generate PDF & Download</button>
      </div>

      <!-- PDF TO IMAGE -->
      <div id="tab-pdf2img" class="tab-content" style="display: none;">
        <h3>Extract PDF Pages as Images</h3>
        <label>Select PDF File:</label>
        <input type="file" id="pdf2ImgInput" accept="application/pdf">
        <button class="btn" onclick="processPDFToImg()">Convert Pages to Images</button>
        <div id="pdfRenderContainer" style="margin-top: 20px;"></div>
      </div>

      <!-- WORD/TEXT TO PDF -->
      <div id="tab-word2pdf" class="tab-content" style="display: none;">
        <h3>Word / Document Content to PDF</h3>
        <label>Type or Paste Text / Document Content:</label>
        <textarea id="docContent" rows="8" placeholder="Paste your text or Word manuscript here..."></textarea>
        <button class="btn" onclick="processTextToPDF()">Export as PDF</button>
      </div>

      <div id="docStatus" style="margin-top: 20px; text-align: center; color: #38bdf8; font-weight: 600;"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 MultiTools Portal</p>
  </footer>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).style.display = 'block';
      event.target.classList.add('active');
    }

    async function processPDFMerge() {
      let files = document.getElementById('mergeInput').files;
      if (files.length < 2) { alert("Please select at least 2 PDF files to merge!"); return; }

      document.getElementById('docStatus').innerText = "Merging PDFs... Please wait.";
      const mergedPdf = await PDFLib.PDFDocument.create();

      for (let f of files) {
        let bytes = await f.arrayBuffer();
        let pdf = await PDFLib.PDFDocument.load(bytes);
        let copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach(p => mergedPdf.addPage(p));
      }

      let pdfBytes = await mergedPdf.save();
      downloadBlob(pdfBytes, 'merged_document.pdf', 'application/pdf');
      document.getElementById('docStatus').innerText = "✔ PDF Files Successfully Merged!";
    }

    async function processImgToPDF() {
      let files = document.getElementById('img2PdfInput').files;
      if (!files.length) { alert("Please select image files first!"); return; }

      document.getElementById('docStatus').innerText = "Generating PDF from images...";
      const pdfDoc = await PDFLib.PDFDocument.create();

      for (let f of files) {
        let bytes = await f.arrayBuffer();
        let img = f.type.includes('png') ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
        let page = pdfDoc.addPage([img.width, img.height]);
        page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
      }

      let pdfBytes = await pdfDoc.save();
      downloadBlob(pdfBytes, 'converted_images.pdf', 'application/pdf');
      document.getElementById('docStatus').innerText = "✔ Image to PDF Conversion Complete!";
    }

    async function processPDFToImg() {
      let file = document.getElementById('pdf2ImgInput').files[0];
      if (!file) { alert("Please select a PDF file!"); return; }

      document.getElementById('docStatus').innerText = "Processing PDF Pages...";
      let arrayBuffer = await file.arrayBuffer();
      let pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
      let container = document.getElementById('pdfRenderContainer');
      container.innerHTML = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        let page = await pdf.getPage(i);
        let viewport = page.getViewport({ scale: 1.5 });
        let canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        canvas.height = viewport.height; canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        let imgUrl = canvas.toDataURL('image/png');

        let link = document.createElement('a');
        link.href = imgUrl; link.download = `page_${i}.png`;
        link.className = 'btn'; link.style.cssText = 'margin: 5px; display: inline-block; width: auto;';
        link.innerText = `Download Page ${i} (PNG)`;
        container.appendChild(link);
      }
      document.getElementById('docStatus').innerText = "✔ Rendered All Pages Successfully!";
    }

    async function processTextToPDF() {
      let text = document.getElementById('docContent').value.trim();
      if (!text) { alert("Please enter text content!"); return; }

      const pdfDoc = await PDFLib.PDFDocument.create();
      const page = pdfDoc.addPage([600, 800]);
      page.drawText(text, { x: 50, y: 750, size: 12 });

      let pdfBytes = await pdfDoc.save();
      downloadBlob(pdfBytes, 'document_export.pdf', 'application/pdf');
    }

    function downloadBlob(bytes, name, type) {
      let blob = new Blob([bytes], { type: type });
      let link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name; link.click();
    }
  </script>
</body>
</html>
