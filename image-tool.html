<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter - MultiTools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">⚡ MultiTools Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="calculator.html">Calculator</a></li>
      <li><a href="unit-converter.html">Converters</a></li>
      <li><a href="reminder.html">Reminder</a></li>
      <li><a href="image-tool.html" class="active">Image Tools</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="tool-box">
      <h2 style="text-align: center; margin-bottom: 20px;">Image Format Converter</h2>
      
      <label>Select Image File:</label>
      <input type="file" id="imgInput" accept="image/*">

      <label>Target Format:</label>
      <select id="formatSelect">
        <option value="image/png">PNG Format</option>
        <option value="image/jpeg">JPEG Format</option>
        <option value="image/webp">WEBP Format</option>
      </select>

      <button class="btn" onclick="convertImage()">Convert & Download</button>
      
      <div id="previewArea" style="margin-top: 20px; text-align: center;"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 MultiTools Portal</p>
  </footer>

  <script>
    function convertImage() {
      let fileInput = document.getElementById('imgInput');
      if (!fileInput.files || !fileInput.files[0]) {
        alert('Please select an image file first!');
        return;
      }

      let file = fileInput.files[0];
      let format = document.getElementById('formatSelect').value;
      let reader = new FileReader();

      reader.onload = function(e) {
        let img = new Image();
        img.onload = function() {
          let canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;

          let ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          let convertedUrl = canvas.toDataURL(format, 0.9);
          
          let ext = format.split('/')[1];
          let preview = document.getElementById('previewArea');
          preview.innerHTML = `
            <p style="color:#16a34a; margin-bottom:10px;">✔ Conversion Successful!</p>
            <a href="${convertedUrl}" download="converted_image.${ext}" class="btn" style="text-decoration:none; display:inline-block; max-width:250px;">Download ${ext.toUpperCase()}</a>
          `;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
