<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Image to PDF Online - Free JPG/PNG Converter</title>
    <meta name="description" content="Convert images (JPG, PNG) to PDF online for free. Fast, browser-based processing with no quality loss.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600">⚡ ToolsPortal</a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600">← Back to All Tools</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Convert JPG/PNG Images to PDF</h1>
            <p class="text-slate-600">Select images to convert them into a single PDF file.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <input type="file" id="imgFileInput" multiple accept="image/png, image/jpeg, image/webp" class="hidden" onchange="updateImgList()">
            
            <label for="imgFileInput" class="border-2 border-dashed border-blue-200 hover:border-blue-500 bg-blue-50/50 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition mb-6">
                <span class="text-3xl mb-2">🖼️</span>
                <span class="font-semibold text-blue-600">Select Images</span>
                <span class="text-xs text-slate-500 mt-1">Supports JPG, PNG, WEBP</span>
            </label>

            <div id="imgList" class="space-y-2 mb-6"></div>

            <button onclick="handleImgSubmit()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition">
                Convert to PDF & Save
            </button>
        </div>
    </main>

    <script src="portal-core.js"></script>
    <script>
        function updateImgList() {
            const input = document.getElementById('imgFileInput');
            const imgList = document.getElementById('imgList');
            imgList.innerHTML = '';
            
            Array.from(input.files).forEach((file) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-100 rounded-lg text-sm text-slate-700 flex justify-between items-center';
                item.innerHTML = `<span>${file.name}</span> <span class="text-xs text-slate-400">${(file.size / 1024).toFixed(1)} KB</span>`;
                imgList.appendChild(item);
            });
        }

        function handleImgSubmit() {
            const input = document.getElementById('imgFileInput');
            processImageToPDF(input.files);
        }
    </script>
</body>
</html>
