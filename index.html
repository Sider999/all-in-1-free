<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tool Utility Portal</title>
    <!-- Libraries for Converters & Formatting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 20px; color: #1a73e8; }
        
        /* Navigation Tabs */
        .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 18px; border: none; background: #e8f0fe; color: #1a73e8; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: #1a73e8; color: #fff; }
        
        .tool-card { display: none; background: #fafafa; border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-top: 10px; }
        .tool-card.active { display: block; }
        
        /* Forms & Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button.action-btn { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.action-btn:hover { background: #218838; }

        /* Calculator Specifics */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .calc-display { grid-column: span 4; font-size: 24px; text-align: right; background: #222; color: #00ffcc; padding: 15px; border-radius: 6px; }
        .calc-btn { background: #e0e0e0; font-size: 16px; font-weight: bold; padding: 15px; border: none; border-radius: 6px; cursor: pointer; }
        .calc-btn:hover { background: #d0d0d0; }
        .calc-btn.op { background: #ff9800; color: white; }
        .calc-btn.sci { background: #009688; color: white; }
        
        .status { margin-top: 10px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Multi-Tool Web Portal</h1>
    
    <!-- Tab Controls -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('reminders')">Reminders Tool</button>
        <button class="tab-btn" onclick="switchTab('calculators')">Simple & Scientific Calculator</button>
        <button class="tab-btn" onclick="switchTab('converters')">Document & Image Converters</button>
    </div>

    <!-- 1. REMINDERS TOOL -->
    <div id="reminders" class="tool-card active">
        <h2>Smart Reminder Tool</h2>
        <div class="form-group">
            <label>Reminder Message:</label>
            <textarea id="remText" rows="3" placeholder="Enter your notification text..."></textarea>
        </div>
        <div class="form-group">
            <label>Send Option / Platform:</label>
            <select id="remPlatform" onchange="toggleContactInput()">
                <option value="whatsapp">WhatsApp Message</option>
                <option value="sms">SMS Text</option>
                <option value="email">Email</option>
                <option value="browser">Browser Notification</option>
            </select>
        </div>
        <div class="form-group" id="contactGroup">
            <label id="contactLabel">Phone Number (with Country Code e.g. 923001234567):</label>
            <input type="text" id="remContact" placeholder="e.g., 923001234567">
        </div>
        <button class="action-btn" onclick="sendReminder()">Send / Schedule Reminder</button>
        <div id="reminderStatus" class="status"></div>
    </div>

    <!-- 2. CALCULATORS -->
    <div id="calculators" class="tool-card">
        <h2>Dual Calculator (Simple & Scientific)</h2>
        <div class="calc-display" id="calcDisplay">0</div>
        
        <!-- Toggle Simple / Scientific Controls -->
        <div style="margin: 10px 0;">
            <label><input type="radio" name="calcType" value="simple" checked onclick="toggleCalcMode()"> Simple Mode</label>
            <label style="margin-left: 15px;"><input type="radio" name="calcType" value="scientific" onclick="toggleCalcMode()"> Scientific Mode</label>
        </div>

        <div class="calc-grid">
            <!-- Scientific Row (Hidden in Simple Mode) -->
            <button class="calc-btn sci sci-mode" onclick="calcFunc('sqrt')">√x</button>
            <button class="calc-btn sci sci-mode" onclick="calcFunc('log')">log10</button>
            <button class="calc-btn sci sci-mode" onclick="calcFunc('ln')">ln</button>
            <button class="calc-btn sci sci-mode" onclick="appendCalc('**')">x^y</button>

            <!-- Standard Buttons -->
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn" onclick="backspaceCalc()">DEL</button>
            <button class="calc-btn op" onclick="appendCalc('/')">/</button>
            <button class="calc-btn op" onclick="appendCalc('*')">*</button>

            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn op" onclick="appendCalc('-')">-</button>

            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn op" onclick="appendCalc('+')">+</button>

            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn op" onclick="calculateResult()">=</button>

            <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendCalc('.')">.</button>
        </div>
    </div>

    <!-- 3. CONVERTERS -->
    <div id="converters" class="tool-card">
        <h2>Document & Image Converters</h2>
        <div class="form-group">
            <label>Select Conversion Type:</label>
            <select id="conversionType">
                <option value="img2pdf">Image to PDF</option>
                <option value="pdf2img">PDF to Image (PNG)</option>
                <option value="word2pdf">Word (.docx) to PDF</option>
                <option value="pdf2word">PDF to Word (.doc)</option>
                <option value="img2word">Image to Word (.doc)</option>
                <option value="word2img">Word (.docx) to Image</option>
            </select>
        </div>
        <div class="form-group">
            <label>Upload Input File:</label>
            <input type="file" id="converterInputFile">
        </div>
        <button class="action-btn" onclick="processConversion()">Convert & Download</button>
        <div id="converterStatus" class="status"></div>
        <div id="canvasContainer" style="display:none;"></div>
    </div>
</div>

<script>
    // Tab Switcher
    function switchTab(tabId) {
        document.querySelectorAll('.tool-card').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    // --- REMINDERS TOOL LOGIC ---
    function toggleContactInput() {
        const platform = document.getElementById('remPlatform').value;
        const label = document.getElementById('contactLabel');
        const group = document.getElementById('contactGroup');
        
        if(platform === 'whatsapp' || platform === 'sms') {
            group.style.display = 'block';
            label.innerText = 'Phone Number (with country code e.g. 923001234567):';
        } else if(platform === 'email') {
            group.style.display = 'block';
            label.innerText = 'Target Email Address:';
        } else {
            group.style.display = 'none';
        }
    }

    function sendReminder() {
        const msg = encodeURIComponent(document.getElementById('remText').value);
        const platform = document.getElementById('remPlatform').value;
        const contact = document.getElementById('remContact').value.trim();
        const status = document.getElementById('reminderStatus');

        if (!msg) { status.innerText = "Please enter a reminder message."; return; }

        if (platform === 'whatsapp') {
            window.open(`https://wa.me/${contact}?text=${msg}`, '_blank');
        } else if (platform === 'sms') {
            window.open(`sms:${contact}?body=${msg}`, '_blank');
        } else if (platform === 'email') {
            window.open(`mailto:${contact}?subject=Reminder&body=${msg}`, '_blank');
        } else if (platform === 'browser') {
            if ("Notification" in window) {
                Notification.requestPermission().then(perm => {
                    if (perm === "granted") new Notification("Reminder", { body: decodeURIComponent(msg) });
                    else alert(decodeURIComponent(msg));
                });
            } else { alert(decodeURIComponent(msg)); }
        }
        status.innerText = "Reminder request launched successfully!";
    }

    // --- CALCULATOR LOGIC ---
    let calcVal = "";
    
    function toggleCalcMode() {
        const mode = document.querySelector('input[name="calcType"]:checked').value;
        const sciBtns = document.querySelectorAll('.sci-mode');
        sciBtns.forEach(btn => btn.style.display = (mode === 'scientific') ? 'block' : 'none');
    }
    toggleCalcMode();

    function appendCalc(val) { calcVal += val; updateCalcDisplay(); }
    function clearCalc() { calcVal = ""; updateCalcDisplay(); }
    function backspaceCalc() { calcVal = calcVal.slice(0, -1); updateCalcDisplay(); }
    function updateCalcDisplay() { document.getElementById('calcDisplay').innerText = calcVal || "0"; }

    function calcFunc(fn) {
        try {
            let current = eval(calcVal || "0");
            if (fn === 'sqrt') calcVal = Math.sqrt(current).toString();
            if (fn === 'log') calcVal = Math.log10(current).toString();
            if (fn === 'ln') calcVal = Math.log(current).toString();
            updateCalcDisplay();
        } catch(e) {
            document.getElementById('calcDisplay').innerText = "Error";
            calcVal = "";
        }
    }

    function calculateResult() {
        try {
            calcVal = eval(calcVal).toString();
            updateCalcDisplay();
        } catch(e) {
            document.getElementById('calcDisplay').innerText = "Error";
            calcVal = "";
        }
    }

    // --- FILE CONVERTERS LOGIC ---
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    async function processConversion() {
        const type = document.getElementById('conversionType').value;
        const fileInput = document.getElementById('converterInputFile');
        const status = document.getElementById('converterStatus');
        
        if (!fileInput.files[0]) { status.innerText = "Please select a file first."; return; }
        const file = fileInput.files[0];
        status.innerText = "Processing conversion, please wait...";

        try {
            if (type === 'img2pdf') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF();
                    pdf.addImage(e.target.result, 'JPEG', 10, 10, 180, 160);
                    pdf.save('converted.pdf');
                    status.innerText = "Completed!";
                };
                reader.readAsDataURL(file);
            } 
            else if (type === 'word2pdf') {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const result = await mammoth.convertToHtml({arrayBuffer: e.target.result});
                    const element = document.createElement('div');
                    element.innerHTML = result.value;
                    html2pdf().from(element).save('converted.pdf');
                    status.innerText = "Completed!";
                };
                reader.readAsArrayBuffer(file);
            }
            else if (type === 'pdf2word') {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    for(let i=1; i<=pdf.numPages; i++){
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + "\n\n";
                    }
                    downloadFile(fullText, 'converted_doc.doc', 'text/plain');
                    status.innerText = "Completed!";
                };
                reader.readAsArrayBuffer(file);
            }
            else if (type === 'pdf2img') {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({scale: 1.5});
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({canvasContext: ctx, viewport: viewport}).promise;
                    
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = 'pdf_page_1.png';
                    a.click();
                    status.innerText = "Completed!";
                };
                reader.readAsArrayBuffer(file);
            }
            else if (type === 'img2word') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const html = `<html><body><img src="${e.target.result}" style="max-width:100%;"></body></html>`;
                    downloadFile(html, 'image_document.doc', 'text/html');
                    status.innerText = "Completed!";
                };
                reader.readAsDataURL(file);
            }
            else if (type === 'word2img') {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const result = await mammoth.convertToHtml({arrayBuffer: e.target.result});
                    const container = document.createElement('div');
                    container.style.width = '600px';
                    container.style.padding = '20px';
                    container.style.background = '#fff';
                    container.innerHTML = result.value;
                    document.body.appendChild(container);
                    
                    html2pdf().from(container).toImg().outputImg('dataurl').then(imgData => {
                        const a = document.createElement('a');
                        a.href = imgData;
                        a.download = 'word_as_image.png';
                        a.click();
                        document.body.removeChild(container);
                        status.innerText = "Completed!";
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        } catch(err) {
            status.innerText = "Error processing file: " + err.message;
        }
    }

    function downloadFile(content, fileName, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
    }
</script>

</body>
</html>
