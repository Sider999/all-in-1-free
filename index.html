<style>

main{max-width:1240px;margin:auto;padding:34px 18px 80px}.hero-card{padding:42px;border:1px solid rgba(0,246,255,.22);border-radius:28px;background:linear-gradient(145deg,rgba(14,21,48,.94),rgba(18,27,61,.82));box-shadow:0 0 60px rgba(0,246,255,.08),var(--shadow);overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;width:420px;height:420px;right:-180px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,172,.22),transparent 64%)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--cyan);font-weight:800}.hero-card h1{font-size:clamp(38px,6vw,72px);line-height:1.03;margin:12px 0}.gradient{background:linear-gradient(90deg,var(--cyan),#7c7cff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.hero-card p{max-width:850px;color:var(--muted);font-size:17px;line-height:1.65}.actions,.toolbar,.links{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:18px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.035)}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}
.section{margin-top:34px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{margin:4px 0 0;font-size:30px}.search{display:flex;align-items:center;gap:8px;min-width:270px;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:13px;padding:0 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:11px 0}.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.cat-card{border:1px solid var(--border);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));color:var(--text);border-radius:18px;padding:20px;text-align:left;min-height:112px;transition:.2s}.cat-card:hover,.tool-card:hover{transform:translateY(-3px);border-color:rgba(0,246,255,.38);box-shadow:0 12px 40px rgba(0,246,255,.08)}.cat-card strong{display:block;font-size:17px;margin-bottom:10px}.cat-card span{color:var(--muted);font-size:13px}.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tool-card{border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:18px;padding:18px;min-height:196px;display:flex;flex-direction:column;transition:.2s}.tool-card .ic{font-size:26px}.tool-card h3{margin:10px 0 7px;font-size:18px}.tool-card p{margin:0;color:var(--muted);line-height:1.5;font-size:13px;flex:1}.row{display:flex;align-items:center;gap:8px;margin-top:15px}.meta{font-size:12px;color:var(--muted)}
.workspace{padding-top:12px}.workspace-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.workspace-head h1{font-size:38px;margin:6px 0 8px}.desc{color:var(--muted);max-width:840px;line-height:1.55}.panel{border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#bfd0ea;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);outline:0;background:#0a1127;color:var(--text);border-radius:12px;padding:12px}.field textarea{resize:vertical;min-height:170px}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(0,246,255,.55);box-shadow:0 0 0 3px rgba(0,246,255,.08)}.toolbar{margin-top:16px}.result{margin-top:18px;padding:16px;border-radius:14px;background:#071027;border:1px solid var(--border);min-height:60px}.result.success{border-color:rgba(72,245,164,.38);box-shadow:0 0 20px rgba(72,245,164,.06)}.result.hidden{display:none}.result pre{margin:0;white-space:pre-wrap;word-break:break-word;color:#dfe9ff}.notice{padding:14px;border-radius:12px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.2);color:#ffe9a7}.task{margin-top:12px;padding:15px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025)}.task-top{display:flex;justify-content:space-between;gap:10px}.links a{padding:8px 10px;border-radius:10px;background:rgba(0,246,255,.08);border:1px solid rgba(0,246,255,.18);font-size:13px}.links a[href="#"]{opacity:.45;pointer-events:none}
.modal-root{position:fixed;inset:0;z-index:60}.rating-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px}.rating{width:min(440px,100%);background:#0b1230;border:1px solid rgba(255,209,102,.35);border-radius:22px;padding:24px;box-shadow:0 25px 90px rgba(0,0,0,.65)}.rating h2{margin:8px 0}.stars{display:flex;justify-content:center;gap:6px;margin:20px 0}.star{font-size:38px;border:0;background:transparent;color:#4b5872;padding:2px}.star.active,.star:hover{color:var(--gold);text-shadow:0 0 20px rgba(255,209,102,.5)}.small{font-size:12px}.muted{color:var(--muted)}
.hidden-by-search{display:none!important}@media(max-width:960px){.cat-grid{grid-template-columns:repeat(3,1fr)}.tools-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.section-head{align-items:stretch;flex-direction:column}.search{min-width:0}.fields{grid-template-columns:1fr}}@media(max-width:620px){.navlinks{display:none}.cat-grid,.tools-grid{grid-template-columns:1fr}.hero-card{padding:26px}.hero-card h1{font-size:42px}.stats{grid-template-columns:1fr}.workspace-head{flex-direction:column}.workspace-head h1{font-size:30px}}

['content-improver','Content Improver','Write'],['essay-writer','Essay Writer','Write'],['paragraph-writer','Paragraph Writer','Write'],['paragraph-completer','Paragraph Completer','Write'],['story-generator','Story Generator','Write'],['grammar-fixer','Grammar Fixer','Write'],['article-writer','Article Writer','Write'],['sentence-rewriter','Sentence Rewriter','Write'],['content-summarizer','Content Summarizer','Write'],['tone-of-voice','Tone of Voice','Write'],['paragraph-rewriter','Paragraph Rewriter','Write'],['content-shortener','Content Shortener','Write'],['title-rewriter','Title Rewriter','Write'],['business-name-generator','Business Name Generator','Write'],['content-paraphraser','Content Paraphraser','Write'],['blog-post-ideas','Blog Post Ideas','Write'],['business-plan-generator','Business Plan Generator','Write'],['word-counter','Word Counter','Write'],
['split-csv','Split CSV','File'],['csv-to-excel','CSV to Excel','File'],['xml-to-csv','XML to CSV','File'],['xml-to-json','XML to JSON','File'],['json-to-xml','JSON to XML','File'],['csv-to-excel-converter','CSV to Excel Converter','File'],['excel-to-csv-converter','Excel to CSV Converter','File'],['csv-to-json-converter','CSV to JSON Converter','File'],['xml-to-csv-converter','XML to CSV Converter','File'],['create-zip','Create ZIP','File'],
['qr-code-generator','QR Code Generator','Other'],['lorem-ipsum-generator','Lorem Ipsum Generator','Other'],['meme-maker','Meme Maker','Other'],['epoch-converter','Epoch Converter','Other']];
const TOOLS=CATALOG.map(([id,name,cat])=>({id,name,cat})); const byId=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const icons={PDF:'📄',Image:'🖼️',Write:'✍️',File:'🗂️',Other:'🧰'};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setResult(html,ok=false){const o=$('#out');if(!o)return;o.className='result'+(ok?' success':'');o.innerHTML=html;}
function setMessage(text,ok=false){setResult(`<pre>${esc(text)}</pre>`,ok)}
function requireEl(id){const e=document.getElementById(id);if(!e)throw new Error('Required control is missing: '+id);return e}
function requireFile(id='files',idx=0){const f=requireEl(id).files[idx];if(!f)throw new Error('Please select the required file.');return f}
function requireFiles(id='files'){const fs=[...requireEl(id).files];if(!fs.length)throw new Error('Please select at least one file.');return fs}
function blobFromCanvas(canvas,type='image/png',quality=.92){return new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('The browser could not encode the image.')),type,quality))}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('This image format could not be decoded by your browser.'))};im.src=u})}
function canvasOf(im,w=im.naturalWidth||im.width,h=im.naturalHeight||im.height){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return [c,c.getContext('2d')];}
function canvasDownload(c,name,type='image/png',quality=.92){return saveBlobPromise(blobFromCanvas(c,type,quality),name)}
let selectedRating=0;
function askRating(name){return new Promise(resolve=>{const root=$('#modalRoot');root.innerHTML=`<div class="rating-backdrop"><div class="rating"><div class="eyebrow">Download confirmation</div><h2>Rate this tool</h2><p class="muted">Choose one of five stars before saving <b>${esc(name)}</b>.</p><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star" data-star="${i}" aria-label="${i} star">★</button>`).join('')}</div><div class="small muted">Your rating is stored only in this browser.</div><div class="toolbar" style="justify-content:center"><button class="btn ghost" id="cancelRate">Cancel</button><button class="btn gold" id="confirmRate" disabled>Save file</button></div></div></div>`;selectedRating=0;root.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{selectedRating=+b.dataset.star;root.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('active',+x.dataset.star<=selectedRating));requireEl('confirmRate').disabled=false});requireEl('cancelRate').onclick=()=>{root.innerHTML='';resolve(false)};requireEl('confirmRate').onclick=()=>{localStorage.setItem('lastDownloadRating',String(selectedRating));root.innerHTML='';resolve(true)}})}
function saveBlobPromise(blobOrPromise,name){return Promise.resolve(blobOrPromise).then(async blob=>{if(!blob)throw new Error('No output was generated.');if(!(await askRating(name)))return false;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true})}
function downloadText(text,name,mime='text/plain'){return saveBlobPromise(new Blob([String(text)],{type:mime}),name)}
function desc(t){return t.cat==='PDF'?'Client-side PDF processing with browser libraries.':t.cat==='Image'?'Client-side image editing and conversion using Canvas.':t.cat==='Write'?'Local deterministic writing utility with no server upload.':t.cat==='File'?'Local file/data conversion in your browser.':'Local browser utility.'}
function fileField(multiple=false,accept=''){return `<div class="field full"><label>File${multiple?'s':''}</label><input id="files" type="file" ${multiple?'multiple':''} ${accept?`accept="${accept}"`:''}></div>`}
function textField(label='Text',id='text',ph='',rows=10){return `<div class="field full"><label>${esc(label)}</label><textarea id="${id}" rows="${rows}" placeholder="${esc(ph)}"></textarea></div>`}
function workspace(t,fields){return `<section class="workspace"><div class="workspace-head"><div><div class="eyebrow">${icons[t.cat]} ${esc(t.cat)} tool</div><h1>${esc(t.name)}</h1><div class="desc">${esc(desc(t))}</div></div><a class="btn ghost" href="#cat:${encodeURIComponent(t.cat)}">Back to ${esc(t.cat)}</a></div><div class="panel"><div class="fields">${fields}</div><div class="toolbar"><button class="btn primary" id="run">Run tool</button><button class="btn ghost" id="reset">Reset</button></div><div id="out" class="result hidden"></div></div></section>`}
function card(t){return `<article class="tool-card" data-name="${esc(slug(t.name))}"><div class="ic">${icons[t.cat]}</div><h3>${esc(t.name)}</h3><p>${esc(desc(t))}</p><div class="row"><span class="meta">${esc(t.cat)} · Browser</span><span style="flex:1"></span><a class="btn primary" href="#tool:${t.id}">Open</a></div></article>`}
function home(){return `<section class="hero-card"><div class="eyebrow">${TOOLS.length} browser-ready tools</div><h1>Useful tools. <span class="gradient">One clean workspace.</span></h1><p>Browse every retained tool from the main page. Each card opens its own genre and dedicated tool workspace. Processing stays in your browser wherever the browser can perform the operation reliably.</p><div class="actions"><a class="btn primary" href="#cat:PDF">Explore PDF</a><a class="btn" href="#cat:Image">Explore Images</a><a class="btn gold" href="#reminder">30-Day Reminders</a></div></section><section class="stats"><div class="stat"><b>${TOOLS.length}</b><span>working catalog tools</span></div><div class="stat"><b>5</b><span>tool genres</span></div><div class="stat"><b>12</b><span>max reminder tasks</span></div><div class="stat"><b>Local</b><span>browser-first processing</span></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Browse by genre</div><h2>Tool categories</h2></div></div><div class="cat-grid">${['PDF','Image','Write','File','Other'].map(cat=>`<button class="cat-card" data-cat="${cat}"><strong>${icons[cat]} ${cat}</strong><span>${TOOLS.filter(t=>t.cat===cat).length} tools</span></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Complete catalog</div><h2>All tools</h2></div><div class="search"><span>⌕</span><input id="homeSearch" placeholder="Search tools..."></div></div><div id="homeTools" class="tools-grid">${TOOLS.map(card).join('')}</div></section>`}
function category(cat){const list=TOOLS.filter(t=>t.cat===cat);return `<section class="section"><div class="section-head"><div><div class="eyebrow">Genre</div><h2>${icons[cat]} ${esc(cat)} tools</h2></div><div class="search"><span>⌕</span><input id="catSearch" placeholder="Search ${esc(cat)} tools..."></div></div><div id="catTools" class="tools-grid">${list.map(card).join('')}</div></section>`}
function reminder(){return `<section class="workspace"><div class="workspace-head"><div><div class="eyebrow">⭐ Gold dashboard</div><h1>30-Day Multi-Task Reminder Suite</h1><div class="desc">Schedule up to 12 tasks for 1 to 30 days. Tasks persist in LocalStorage and generate direct trigger links.</div></div><span class="btn gold"><span id="taskCount">0</span>/12</span></div><div class="panel"><div class="fields"><div class="field"><label>Task title</label><input id="rtTitle" placeholder="Pay utility bill"></div><div class="field"><label>Days from now</label><input id="rtDays" type="number" min="1" max="30" value="1"></div><div class="field full"><label>Message</label><textarea id="rtMessage" rows="5" placeholder="Reminder message"></textarea></div><div class="field"><label>Phone</label><input id="rtPhone" placeholder="923001234567"></div><div class="field"><label>Email</label><input id="rtEmail" type="email" placeholder="name@example.com"></div></div><div class="toolbar"><button class="btn gold" id="addReminder">Add task</button><button class="btn" id="notifyBtn">Enable browser notifications</button><button class="btn danger" id="clearReminders">Clear all</button></div><div id="taskList"></div></div></section>`}
function getTasks(){try{const x=JSON.parse(localStorage.getItem('reminderTasks')||'[]');return Array.isArray(x)?x.filter(t=>t&&t.when):[]}catch{return []}}
function setTasks(x){localStorage.setItem('reminderTasks',JSON.stringify(x))}
function renderTasks(){const list=$('#taskList');const count=$('#taskCount');if(!list)return;const tasks=getTasks().sort((a,b)=>a.when-b.when);if(count)count.textContent=tasks.length;list.innerHTML=tasks.length?tasks.map(t=>{const d=new Date(t.when),phone=String(t.phone||'').replace(/[^0-9+]/g,''),wa=phone?`https://wa.me/${phone.replace(/^\+/,'')}?text=${encodeURIComponent(t.message||t.title)}`:'#',sms=phone?`sms:${encodeURIComponent(phone)}?body=${encodeURIComponent(t.message||t.title)}`:'#',mail=t.email?`mailto:${encodeURIComponent(t.email)}?subject=${encodeURIComponent(t.title)}&body=${encodeURIComponent(t.message||t.title)}`:'#';return `<div class="task"><div class="task-top"><div><b>${esc(t.title)}</b><div class="muted small">${esc(d.toLocaleString())}</div></div><button class="btn danger" data-delete="${t.id}">Delete</button></div><div style="margin-top:8px">${esc(t.message||'')}</div><div class="links" style="margin-top:10px"><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a href="${sms}">SMS</a><a href="${mail}">Email</a><a href="#" data-alert="${t.id}">Browser Alert</a></div></div>`}).join(''):'<div class="notice">No scheduled tasks yet.</div>';list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{setTasks(getTasks().filter(t=>String(t.id)!==String(b.dataset.delete)));renderTasks()});list.querySelectorAll('[data-alert]').forEach(b=>b.onclick=e=>{e.preventDefault();const t=getTasks().find(x=>String(x.id)===String(b.dataset.alert));if(t)alert(`${t.title}\n\n${t.message||''}\n\nScheduled: ${new Date(t.when).toLocaleString()}`)})}
async function setupReminder(){renderTasks();requireEl('addReminder').onclick=()=>{const tasks=getTasks();if(tasks.length>=12)return setMessage('Maximum 12 reminder tasks allowed.');const title=requireEl('rtTitle').value.trim(),days=Number(requireEl('rtDays').value);if(!title||!Number.isInteger(days)||days<1||days>30)return setMessage('Enter a task title and a whole number from 1 to 30 days.');tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title,message:requireEl('rtMessage').value.trim(),days,when:Date.now()+days*86400000,phone:requireEl('rtPhone').value.trim(),email:requireEl('rtEmail').value.trim()});setTasks(tasks);renderTasks();['rtTitle','rtMessage','rtPhone','rtEmail'].forEach(id=>requireEl(id).value='')};requireEl('clearReminders').onclick=()=>{if(confirm('Clear all reminder tasks?')){setTasks([]);renderTasks()}};requireEl('notifyBtn').onclick=async()=>{if(!('Notification' in window))return setMessage('Browser notifications are not supported here.');const p=await Notification.requestPermission();setMessage('Notification permission: '+p,p==='granted')};setInterval(()=>checkReminderNotifications(),60000);checkReminderNotifications()}
function checkReminderNotifications(){if(!('Notification' in window)||Notification.permission!=='granted')return;const now=Date.now(),last=Number(localStorage.getItem('reminderLastCheck')||0);if(now-last<50000)return;localStorage.setItem('reminderLastCheck',String(now));getTasks().forEach(t=>{if(t.when<=now&&!t.notified){try{new Notification(t.title,{body:t.message||'Scheduled reminder'})}catch{}t.notified=true;setTasks(getTasks().map(x=>String(x.id)===String(t.id)?t:x))}})}

if(id==='split-csv'){const rows=parseCsv(text),chunk=Math.max(1,Number(requireEl('chunk').value)||100);if(!rows.length)throw new Error('CSV is empty.');const z=new JSZip();for(let i=0,p=1;i<rows.length;i+=chunk,p++)z.file(`part-${p}.csv`,csvString(rows.slice(i,i+chunk)));await saveBlobPromise(await z.generateAsync({type:'blob'}),'csv-parts.zip');return}
setResult(`<pre>${esc(text.slice(0,30000))}</pre>`,true)}catch(e){setMessage(e.message||String(e))}}
async function runOther(t){try{const id=t.id;if(id==='qr-code-generator'){if(!window.QRCode)throw new Error('QR library failed to load.');const out=requireEl('out');out.className='result';out.innerHTML='';new QRCode(out,{text:requireEl('text').value||'https://example.com',width:280,height:280,correctLevel:QRCode.CorrectLevel.H});const btn=document.createElement('button');btn.className='btn primary';btn.textContent='Download PNG';btn.style.marginTop='12px';out.appendChild(btn);btn.onclick=async()=>{const canvas=out.querySelector('canvas');if(canvas)return canvasDownload(canvas,'qrcode.png');const img=out.querySelector('img');if(!img)throw new Error('QR image was not generated.');const c=document.createElement('canvas');c.width=img.naturalWidth||280;c.height=img.naturalHeight||280;c.getContext('2d').drawImage(img,0,0);return canvasDownload(c,'qrcode.png')};return}
if(id==='lorem-ipsum-generator'){const n=Math.max(1,Math.min(50,Number(requireEl('count').value)||3)),p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer facilisis sapien at posuere volutpat.';const out=Array.from({length:n},()=>p).join('\n\n');setResult(`<pre>${esc(out)}</pre><div class="toolbar"><button class="btn primary" id="downloadText">Download text</button></div>`,true);requireEl('downloadText').onclick=()=>downloadText(out,'lorem-ipsum.txt');return}
if(id==='meme-maker'){const im=await loadImage(requireFile());const [c,ctx]=canvasOf(im);ctx.drawImage(im,0,0);ctx.font='700 52px Impact,Arial';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.fillStyle='#fff';const entries=[[requireEl('top').value,65],[requireEl('bottom').value,c.height-20]];entries.forEach(([txt,y])=>{ctx.strokeText(String(txt).toUpperCase(),c.width/2,y);ctx.fillText(String(txt).toUpperCase(),c.width/2,y)});await saveBlobPromise(await blobFromCanvas(c,'image/jpeg',.92),'meme.jpg');return}
if(id==='epoch-converter'){const mode=requireEl('mode').value,v=requireEl('value').value.trim();if(mode.startsWith('Epoch')){const n=Number(v);if(!Number.isFinite(n))throw new Error('Enter a valid epoch value.');setResult(`<b>${esc(new Date(n*1000).toISOString())}</b>`,true)}else{const d=new Date(v);if(Number.isNaN(d.getTime()))throw new Error('Enter a valid date/time.');setResult(`<b>${Math.floor(d.getTime()/1000)}</b>`,true)}return}
throw new Error('Unsupported utility tool.')}catch(e){setMessage(e.message||String(e))}}
function resetWorkspace(){location.hash=location.hash}
function bindWorkspace(t){const r=$('#run');if(r)r.onclick=async()=>{r.disabled=true;$('#out')?.classList.remove('hidden');try{if(t.cat==='PDF')await runPdf(t);else if(t.cat==='Image')await runImage(t);else if(t.cat==='Write')runWrite(t);else if(t.cat==='File')await runFile(t);else await runOther(t)}finally{r.disabled=false}};const reset=$('#reset');if(reset)reset.onclick=()=>render()}
function render(){const hash=location.hash||'#home';const app=$('#app');if(hash==='#home'){app.innerHTML=home();bindHome();return}if(hash==='#reminder'){app.innerHTML=reminder();setupReminder();return}if(hash.startsWith('#cat:')){const cat=decodeURIComponent(hash.slice(5));if(!icons[cat])return render404();app.innerHTML=category(cat);bindSearch($('#catSearch'),$('#catTools'));return}if(hash.startsWith('#tool:')){const t=byId[hash.slice(6)];if(!t)return render404();app.innerHTML=workspace(t,inputsFor(t));bindWorkspace(t);return}render404()}
function render404(){location.hash='#home'}
function bindHome(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>location.hash='cat:'+b.dataset.cat);bindSearch($('#homeSearch'),$('#homeTools'))}
function bindSearch(input,container){if(!input||!container)return;input.oninput=()=>{const q=slug(input.value);container.querySelectorAll('.tool-card').forEach(c=>c.classList.toggle('hidden-by-search',q && !c.dataset.name.includes(q)))}}
$('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('hashchange',render);window.addEventListener('load',()=>{render();if('serviceWorker' in navigator){} });
</script>
