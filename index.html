.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:34px 0 13px}.section-head h2{margin:0;font-size:25px}.section-head p{margin:0;color:var(--muted)}.category-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.cat-card{padding:15px;cursor:pointer;transition:.18s}.cat-card:hover{transform:translateY(-3px);border-color:rgba(39,233,255,.3)}.cat-card strong{display:block}.cat-card span{font-size:11px;color:var(--muted)}.tool-section{margin-top:30px}.tool-label{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.tool-label h3{margin:0;font-size:20px}.tool-label span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.tool-card{padding:15px;position:relative;overflow:hidden;transition:.18s}.tool-card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}.tool-card:hover{transform:translateY(-4px);border-color:rgba(138,92,255,.38);box-shadow:0 24px 55px rgba(0,0,0,.3),0 0 30px rgba(138,92,255,.08)}.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,rgba(39,233,255,.13),rgba(255,41,216,.12));border:1px solid rgba(255,255,255,.08);font-weight:900;margin-bottom:10px}.tool-card h3{font-size:15px;line-height:1.25;margin:0 0 6px}.tool-card p{min-height:54px;margin:0 0 11px;color:var(--muted);font-size:12px}.meta{color:#7e88aa;font-size:10px}.btn{border:1px solid var(--line);background:#11183a;color:#eef2ff;border-radius:11px;padding:9px 12px;transition:.16s}.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.22)}.btn.primary{border-color:transparent;background:linear-gradient(90deg,var(--violet),var(--pink));box-shadow:0 8px 30px rgba(255,41,216,.18)}.btn.gold{background:linear-gradient(90deg,#604500,#332600);border-color:rgba(255,212,90,.5);color:#fff2b4}.btn.cyan{background:linear-gradient(90deg,#074e64,#102f45);border-color:rgba(39,233,255,.43)}.btn.danger{border-color:rgba(255,93,143,.28);background:rgba(255,93,143,.08);color:#ffb8ce}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:#dce4ff}.page{padding:24px}.sub{color:var(--muted);margin:0 0 18px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700;color:#dfe6fb}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:#0d1435;color:#fff;outline:none}.field textarea{min-height:200px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(39,233,255,.5);box-shadow:0 0 0 4px rgba(39,233,255,.06)}.drop{padding:24px;border:2px dashed rgba(138,92,255,.38);border-radius:15px;text-align:center;color:var(--muted);background:rgba(138,92,255,.05)}.drop input{display:block;margin:12px auto 0}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.result{margin-top:14px;padding:14px;border:1px dashed rgba(39,233,255,.24);border-radius:12px;background:rgba(5,9,24,.76)}.result pre{white-space:pre-wrap;word-break:break-word}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.good{color:#c9ff8a}.bad{color:#ff9fbd}.preview{max-width:100%;max-height:500px;border-radius:13px;background:#fff;border:1px solid var(--line)}.task{padding:13px;border:1px solid var(--line);background:rgba(17,23,50,.72);border-radius:13px}.task+.task{margin-top:9px}.task-top{display:flex;justify-content:space-between;gap:10px}.task small{color:var(--muted)}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.links a{padding:6px 9px;background:rgba(138,92,255,.12);border:1px solid rgba(138,92,255,.28);border-radius:8px;font-size:11px}.gold-card{background:linear-gradient(140deg,rgba(91,67,4,.65),rgba(30,20,49,.93))}.footer{text-align:center;color:#687392;font-size:11px;padding:38px 0 10px}.modal{position:fixed;inset:0;display:none;place-items:center;z-index:100;background:rgba(2,3,10,.78);backdrop-filter:blur(8px)}.modal.show{display:grid}.modal .box{width:min(520px,calc(100vw - 24px));padding:24px;background:linear-gradient(180deg,#171c3f,#0c102c);border:1px solid var(--line);border-radius:21px;box-shadow:0 35px 90px rgba(0,0,0,.52)}.stars{display:flex;justify-content:center;gap:7px;margin:16px 0 7px}.star{border:0;background:transparent;font-size:38px;color:#5f6782}.star.active{color:var(--gold);text-shadow:0 0 18px rgba(255,212,90,.45)}

'use strict';
const CATALOG=[{"id":"jpg-to-pdf","name":"JPG to PDF","cat":"PDF"},{"id":"merge-pdf","name":"Merge PDF","cat":"PDF"},{"id":"create-pdf","name":"Create PDF","cat":"PDF"},{"id":"pdf-to-jpg","name":"PDF to JPG","cat":"PDF"},{"id":"extract-text","name":"Extract Text","cat":"PDF"},{"id":"pdf-to-png","name":"PDF to PNG","cat":"PDF"},{"id":"gif-to-pdf","name":"GIF to PDF","cat":"PDF"},{"id":"webp-to-pdf","name":"WebP to PDF","cat":"PDF"},{"id":"tiff-to-pdf","name":"TIFF to PDF","cat":"PDF"},{"id":"pdf-to-text","name":"PDF to Text","cat":"PDF"},{"id":"extract-text-from-pdf","name":"Extract text from PDF","cat":"PDF"},{"id":"resize-dimensions","name":"Resize Dimensions","cat":"Image"},{"id":"compress","name":"Compress","cat":"Image"},{"id":"combine-images","name":"Combine Images","cat":"Image"},{"id":"collage-maker","name":"Collage Maker","cat":"Image"},{"id":"chart-maker","name":"Chart Maker","cat":"Image"},{"id":"crop-image","name":"Crop Image","cat":"Image"},{"id":"add-border-to-image","name":"Add Border to Image","cat":"Image"},{"id":"add-text-to-image","name":"Add Text to Image","cat":"Image"},{"id":"pixelate-image","name":"Pixelate Image","cat":"Image"},{"id":"make-round-image","name":"Make Round Image","cat":"Image"},{"id":"black-white","name":"Black & White","cat":"Image"},{"id":"flip-image","name":"Flip Image","cat":"Image"},{"id":"webp-to-jpg","name":"WebP to JPG","cat":"Image"},{"id":"png-to-jpg","name":"PNG to JPG","cat":"Image"},{"id":"webp-to-png","name":"WEBP to PNG","cat":"Image"},{"id":"jpg-to-png","name":"JPG to PNG","cat":"Image"},{"id":"png-to-webp","name":"PNG to WEBP","cat":"Image"},{"id":"jpg-to-webp","name":"JPG to WEBP","cat":"Image"},{"id":"svg-to-png","name":"SVG to PNG","cat":"Image"},{"id":"content-improver","name":"Content Improver","cat":"Write"},{"id":"essay-writer","name":"Essay Writer","cat":"Write"},{"id":"paragraph-writer","name":"Paragraph Writer","cat":"Write"},{"id":"paragraph-completer","name":"Paragraph Completer","cat":"Write"},{"id":"story-generator","name":"Story Generator","cat":"Write"},{"id":"grammar-fixer","name":"Grammar Fixer","cat":"Write"},{"id":"article-writer","name":"Article Writer","cat":"Write"},{"id":"sentence-rewriter","name":"Sentence Rewriter","cat":"Write"},{"id":"content-summarizer","name":"Content Summarizer","cat":"Write"},{"id":"tone-of-voice","name":"Tone of Voice","cat":"Write"},{"id":"paragraph-rewriter","name":"Paragraph Rewriter","cat":"Write"},{"id":"content-shortener","name":"Content Shortener","cat":"Write"},{"id":"title-rewriter","name":"Title Rewriter","cat":"Write"},{"id":"business-name-generator","name":"Business Name Generator","cat":"Write"},{"id":"content-paraphraser","name":"Content Paraphraser","cat":"Write"},{"id":"blog-post-ideas","name":"Blog Post Ideas","cat":"Write"},{"id":"business-plan-generator","name":"Business Plan Generator","cat":"Write"},{"id":"word-counter","name":"Word Counter","cat":"Write"},{"id":"split-csv","name":"Split CSV","cat":"File"},{"id":"csv-to-excel","name":"CSV to Excel","cat":"File"},{"id":"xml-to-csv","name":"XML to CSV","cat":"File"},{"id":"xml-to-json","name":"XML to JSON","cat":"File"},{"id":"json-to-xml","name":"JSON to XML","cat":"File"},{"id":"csv-to-excel-converter","name":"CSV to Excel Converter","cat":"File"},{"id":"excel-to-csv-converter","name":"Excel to CSV Converter","cat":"File"},{"id":"csv-to-json-converter","name":"CSV to JSON Converter","cat":"File"},{"id":"xml-to-csv-converter","name":"XML to CSV Converter","cat":"File"},{"id":"create-zip","name":"Create Zip","cat":"File"},{"id":"create-zip-file","name":"Create ZIP","cat":"File"},{"id":"qr-code-generator","name":"QR Code Generator","cat":"Other"},{"id":"lorem-ipsum-generator","name":"Lorem Ipsum Generator","cat":"Other"},{"id":"meme-maker","name":"Meme Maker","cat":"Other"},{"id":"epoch-converter","name":"Epoch Converter","cat":"Other"}];
const byId=Object.fromEntries(CATALOG.map(x=>[x.id,x]));
const CAT_ORDER=['PDF','Image','Write','File','Other'];
const CAT_ICONS={PDF:'▣',Image:'✦',Write:'Aa',Video:'▶',File:'↔',Web:'⌁',Other:'⚙'};
const state={pending:null,rating:0,query:''};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'download';
function desc(t){const n=t.name.toLowerCase();if(t.cat==='PDF')return 'Browser PDF workspace with local processing where supported.';if(t.cat==='Image')return 'Image utility using Canvas and browser-side processing.';if(t.cat==='Write')return 'Writing workspace with deterministic smart templates and text analysis.';if(t.cat==='Video')return 'Browser media workspace with playback, metadata and Web Media operations.';if(t.cat==='File')return 'Local file and data conversion utility.';if(t.cat==='Web')return 'Privacy-friendly URL utility. Browser security rules apply.';if(n.includes('qr'))return 'Generate a QR code locally in your browser.';return 'Browser utility with a focused, working operation.'}
function card(t){return `<article class="tool-card"><div class="ic">${CAT_ICONS[t.cat]||'•'}</div><h3>${esc(t.name)}</h3><p>${esc(desc(t))}</p><div class="row" style="justify-content:space-between"><span class="meta">${esc(t.cat)} · Local</span><a class="btn primary" href="#tool:${encodeURIComponent(t.id)}">Open</a></div></article>`}
function catCard(cat){const c=CATALOG.filter(x=>x.cat===cat).length;return `<button class="cat-card" data-cat="${cat}"><strong>${CAT_ICONS[cat]} ${cat}</strong><span>${c} tools</span></button>`}
function home(){let taskCount=readTasks().length;return `<section class="hero"><div class="card"><span class="kicker"><i></i> ${CATALOG.length} browser-capable utilities</span><h1>Useful tools.<br><span style="background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent">Organized by genre.</span></h1><p>Every tool shown here has a browser-side implementation or a deterministic local workflow. Tools that depend on proprietary AI, advanced OCR, protected-PDF cracking, specialist ebook/graphics formats, social-media scraping, or unavailable codecs are intentionally excluded.</p><div class="stats"><div class="stat"><b>${CATALOG.length}</b><span>Working catalog entries</span></div><div class="stat"><b>${CAT_ORDER.filter(c=>CATALOG.some(x=>x.cat===c)).length}</b><span>Tool genres</span></div><div class="stat"><b id="homeCount">${taskCount} / 12</b><span>Reminder tasks</span></div><div class="stat"><b>Local</b><span>Browser-first processing</span></div></div></div><div class="hero-side"><div class="card quick gold-card"><h3>⏰ 30-Day Multi-Task Reminder</h3><p>12 task maximum, 1–30 day scheduling, persistent storage, WhatsApp, SMS, email and browser alerts.</p><div style="margin-top:12px"><a class="btn gold" href="#reminder">Open Reminder Suite</a></div></div><div class="card quick"><h3>✓ Static-site safety</h3><p>No dead buttons for excluded backend-only services. Each visible card leads to a concrete browser workflow.</p></div></div></section><div class="section-head"><div><h2>Browse genres</h2><p>Use a genre page to focus on one type of work.</p></div></div><div class="category-strip">${CAT_ORDER.filter(c=>CATALOG.some(x=>x.cat===c)).map(catCard).join('')}</div>${CAT_ORDER.filter(c=>CATALOG.some(x=>x.cat===c)).map(cat=>`<section class="tool-section"><div class="tool-label"><h3>${CAT_ICONS[cat]} ${cat}</h3><span>${CATALOG.filter(x=>x.cat===cat).length} tools</span></div><div class="grid">${CATALOG.filter(x=>x.cat===cat).map(card).join('')}</div></section>`).join('')}<div class="footer">All-in-1 Free Tools · Static GitHub Pages build · No TinyWow branding</div>`}
function category(cat){const arr=CATALOG.filter(x=>x.cat===cat);return `<div class="page"><div class="row" style="justify-content:space-between"><div><h1 style="font-size:42px">${esc(cat)} Tools</h1><p class="sub">${arr.length} available tools in this category.</p></div><a class="btn" href="#home">Home</a></div><div class="grid">${arr.map(card).join('')}</div></div>`}
function shell(t,body,note=''){return `<div class="page"><div class="row" style="justify-content:space-between;gap:14px"><div><h1 style="font-size:40px">${esc(t.name)}</h1><p class="sub">${esc(desc(t))}</p></div><span class="tag">${esc(t.cat)} · browser</span></div>${note?`<div class="result"><span>${esc(note)}</span></div>`:''}<div style="margin-top:16px">${body}</div></div>`}
function fileField(multiple=false,accept=''){return `<div class="drop">Drop files here or choose from your device<input id="files" type="file" ${multiple?'multiple':''} ${accept?`accept="${accept}"`:''}></div>`}
function outputArea(){return `<div id="out" class="result hidden"></div>`}
function writePage(t){const templates={
 'Content Improver':'Improve clarity, grammar, structure, and readability while preserving the meaning.',

 const p=templates[t.name]||'Create or transform text based on the instruction you provide.';

function xmlEscape(v){return String(v??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}

async function runData(t){const n=t.name.toLowerCase(),allFiles=[...($('#files')?.files||[])],f=allFiles[0];let text=$('#data')?.value.trim()||'';if(f&&!text){if(/xlsx|xls|excel/.test(f.name.toLowerCase())&&window.XLSX){const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];text=XLSX.utils.sheet_to_csv(ws)}else text=await f.text()}
if(!text)throw new Error('Provide a file or paste data.');if(/csv/.test(n)&&/json/.test(n)){const rows=parseCsv(text),h=rows.shift()||[],a=rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));downloadBlob(new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),'converted.json');return}
if(/json/.test(n)&&/csv/.test(n)){const o=JSON.parse(text);if(!Array.isArray(o))throw new Error('Expected an array of objects.');const h=[...new Set(o.flatMap(x=>Object.keys(x||{})))];downloadBlob(new Blob([csvString([h,...o.map(x=>h.map(k=>x[k]??''))])],{type:'text/csv'}),'converted.csv');return}
if(/json/.test(n)&&/xml/.test(n)){downloadBlob(new Blob(['<?xml version="1.0" encoding="UTF-8"?>',objectToXml(JSON.parse(text))],{type:'application/xml'}),'converted.xml');return}
if(/xml/.test(n)&&/json/.test(n)){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid XML.');downloadBlob(new Blob([JSON.stringify({root:doc.documentElement.outerHTML},null,2)],{type:'application/json'}),'converted.json');return}
if(/csv/.test(n)&&/excel/.test(n)&&window.XLSX){const ws=XLSX.utils.aoa_to_sheet(parseCsv(text)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');downloadBlob(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'converted.xlsx');return}
if(/excel/.test(n)&&/csv/.test(n)&&f&&window.XLSX){const wb=XLSX.read(await f.arrayBuffer()),ws=wb.Sheets[wb.SheetNames[0]];downloadBlob(new Blob([XLSX.utils.sheet_to_csv(ws)],{type:'text/csv'}),'converted.csv');return}
if(/xml/.test(n)&&/csv/.test(n)){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid XML.');const rows=[...doc.documentElement.children].map(r=>[...r.children].map(c=>c.textContent));downloadBlob(new Blob([csvString(rows)],{type:'text/csv'}),'converted.csv');return}
if(/create zip|zip/.test(n)&&window.JSZip){const z=new JSZip();if(allFiles.length){for(const item of allFiles)z.file(item.name,item)}else if(f)z.file(f.name,f);else z.file('data.txt',text);downloadBlob(await z.generateAsync({type:'blob'}),'archive.zip');return}
if(/split csv/.test(n)){const rows=parseCsv(text),chunk=100;const parts=[];for(let i=0;i<rows.length;i+=chunk)parts.push(csvString(rows.slice(i,i+chunk)));downloadBlob(new Blob(parts,{type:'text/csv'}),'split.csv');return}
const o=$('#out');o.classList.remove('hidden');o.innerHTML=`<pre>${esc(text.slice(0,30000))}</pre>`}
async function runVideo(t){throw new Error('Video tools were removed from this static build because reliable codec conversion cannot be guaranteed on GitHub Pages.')}
async function runWeb(t){throw new Error('Web scraping/downloader tools were removed from this static build because cross-origin restrictions cannot be bypassed safely.')}
async function runOther(t){const n=t.name.toLowerCase(),o=$('#out');if(n.includes('qr')){if(!window.QRCode)throw new Error('QR library has not loaded.');o.innerHTML='';new QRCode(o,{text:$('#text').value||'All-in-1 Free Tools',width:280,height:280,correctLevel:QRCode.CorrectLevel.H});return}if(n.includes('lorem')){const c=Math.max(1,Math.min(100,Number($('#count').value)||3));const p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer facilisis, sapien at posuere volutpat, est arcu commodo mauris, sed tristique nibh lectus vitae justo.';o.classList.remove('hidden');o.innerHTML=`<pre>${esc(Array.from({length:c},()=>p).join('\n\n'))}</pre>`;return}if(n.includes('epoch')){const v=$('#value').value.trim();o.classList.remove('hidden');o.innerHTML=$('#mode').value.startsWith('Epoch')?esc(new Date(Number(v)*1000).toISOString()):esc(String(Math.floor(new Date(v).getTime()/1000)));return}
const f=$('#files')?.files?.[0];if(!f)throw new Error('Choose an image first.');const im=await canvasFromFile(f),c=document.createElement('canvas');c.width=1200;c.height=900;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);x.font='bold 48px Arial';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=6;x.strokeText($('#top').value||'',40,70);x.fillText($('#top').value||'',40,70);x.strokeText($('#bottom').value||'',40,850);x.fillText($('#bottom').value||'',40,850);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));downloadBlob(b,'meme.jpg')}
function toolPage(id){const t=byId[id];if(!t)return home();if(t.cat==='Image')return imagePage(t);if(t.cat==='PDF')return pdfPage(t);if(t.cat==='Write')return writePage(t);if(t.cat==='File')return dataPage(t);return otherPage(t)}
function handleNav(h){if(h==='home')$('#view').innerHTML=home();else if(h==='reminder')$('#view').innerHTML=reminder();else if(h.startsWith('cat:'))$('#view').innerHTML=category(decodeURIComponent(h.slice(4)));else if(h.startsWith('tool:'))$('#view').innerHTML=toolPage(decodeURIComponent(h.slice(5)));else $('#view').innerHTML=home();attachView();refreshCount();window.scrollTo(0,0)}
function attachView(){
 $$('#catNav [data-nav]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.nav});
 $$('#view [data-cat]').forEach(b=>b.onclick=()=>{location.hash='cat:'+encodeURIComponent(b.dataset.cat)});
 const h=navHash(),t=h.startsWith('tool:')?byId[decodeURIComponent(h.slice(5))]:null,r=$('#run');
 if(r&&t)r.onclick=async()=>{const o=$('#out');if(o&&!o.innerHTML)o.classList.remove('hidden');try{if(t.cat==='Image')await runImage(t);else if(t.cat==='PDF')await runPdf(t);else if(t.cat==='Write'){const out=smartText(t,$('#prompt').value,$('#tone').value);o.classList.remove('hidden');o.innerHTML=`<pre>${esc(out)}</pre>`;o.dataset.text=out}else if(t.cat==='File')await runData(t);else if(t.cat==='Video')await runVideo(t);else if(t.cat==='Web')await runWeb(t);else await runOther(t)}catch(e){if(o){o.classList.remove('hidden');o.innerHTML=`<span class="bad">${esc(e.message||e)}</span>`}}};
 if(t&&t.cat==='Write'){$('#copy')?.addEventListener('click',async()=>{const txt=$('#out')?.dataset.text||$('#out')?.innerText||'';if(!txt)return alert('Generate a result first.');await navigator.clipboard.writeText(txt);alert('Copied.')} );$('#downloadText')?.addEventListener('click',()=>{const txt=$('#out')?.dataset.text||$('#out')?.innerText||'';if(!txt)return alert('Generate a result first.');downloadBlob(new Blob([txt],{type:'text/plain'}),`${slug(t.name)}.txt`)})}
 if(t&&t.cat==='PDF'&&$('#downloadText'))$('#downloadText').addEventListener('click',()=>{const txt=$('#out')?.dataset.text||$('#out')?.innerText||'';if(!txt)return alert('Extract text first.');downloadBlob(new Blob([txt],{type:'text/plain'}),`${slug(t.name)}.txt`)});
 if(t&&t.cat==='Web'){$('#openUrl')?.addEventListener('click',e=>{if(!/^https?:\/\//i.test($('#url').value.trim())){e.preventDefault();alert('Enter a valid URL first.')}})}
 if(h==='reminder'){$('#addTask')?.addEventListener('click',()=>{const tasks=readTasks();if(tasks.length>=12)return alert('Maximum 12 tasks reached.');const title=$('#taskTitle').value.trim();const days=Math.max(1,Math.min(30,Number($('#taskDays').value)||1));if(!title)return alert('Task title is required.');tasks.push({id:crypto.randomUUID?.()||String(Date.now()),title,days,message:$('#taskMsg').value.trim()||title,target:$('#target').value.trim(),when:Date.now()+days*86400000,alerted:false});saveTasks(tasks);location.hash='reminder'});$('#clearTasks')?.addEventListener('click',()=>{if(confirm('Delete all reminder tasks?')){saveTasks([]);location.hash='reminder'}});$('#notify')?.addEventListener('click',async()=>{if(!('Notification' in window))return alert('Notifications are not supported by this browser.');const p=await Notification.requestPermission();alert(p==='granted'?'Browser notifications enabled.':`Permission: ${p}`)});$$('[data-delete-task]').forEach(b=>b.onclick=()=>{saveTasks(readTasks().filter(x=>String(x.id)!==String(b.dataset.deleteTask)));location.hash='reminder'});$$('[data-alert-task]').forEach(a=>a.onclick=e=>{e.preventDefault();const x=readTasks().find(t=>String(t.id)===String(a.dataset.alertTask));if(x)alert(`${x.title}\n\n${x.message}`)})}
}
function navHash(){return location.hash.replace(/^#/,'')||'home'}
function refreshCount(){const n=readTasks().length;$('#sideCount').textContent=`${n}/12`;const h=$('#homeCount');if(h)h.textContent=`${n} / 12`}
function buildCatNav(){$('#catNav').innerHTML=CAT_ORDER.filter(cat=>CATALOG.some(x=>x.cat===cat)).map(cat=>`<button data-nav="cat:${encodeURIComponent(cat)}">${CAT_ICONS[cat]} ${cat} <span class="badge" style="background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1);color:#adb6d4">${CATALOG.filter(x=>x.cat===cat).length}</span></button>`).join('')}
function systemTest(){const checks=[];const add=(name,ok,detail)=>checks.push(`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(name)}</span><span class="${ok?'good':'bad'}">${ok?'PASS':'CHECK'} · ${esc(detail)}</span></div>`);add('Catalog',CATALOG.length>0,`${CATALOG.length} supported entries`);add('LocalStorage','localStorage' in window,'available');add('Canvas',!!document.createElement('canvas').getContext,'available');add('Download gate',!!$('#downloadModal'),'available');add('PDF.js',!!window.pdfjsLib,window.pdfjsLib?'loaded':'CDN not loaded');add('pdf-lib',!!window.PDFLib,window.PDFLib?'loaded':'CDN not loaded');add('jsPDF',!!window.jspdf,window.jspdf?'loaded':'CDN not loaded');add('XLSX',!!window.XLSX,window.XLSX?'loaded':'CDN not loaded');add('JSZip',!!window.JSZip,window.JSZip?'loaded':'CDN not loaded');add('QRCode',!!window.QRCode,window.QRCode?'loaded':'CDN not loaded');alert(checks.join('').replace(/<[^>]+>/g,''));}
window.addEventListener('hashchange',()=>handleNav(navHash()));
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();state.query=q;if(!q){handleNav(navHash()==='home'?'home':navHash());return}const a=CATALOG.filter(t=>(t.name+' '+t.cat).toLowerCase().includes(q));$('#view').innerHTML=`<div class="page"><h1 style="font-size:42px">Search results</h1><p class="sub">${a.length} match(es) for “${esc(q)}”.</p><div class="grid">${a.map(card).join('')}</div></div>`;attachView()};
$('#downloadModal').onclick=e=>{const s=e.target.closest('[data-star]');if(s){state.rating=Number(s.dataset.star);renderStars();$('#ratingText').textContent=`${state.rating} / 5 stars`;$('#confirmRating').disabled=false}};$('#confirmRating').onclick=savePending;$('#cancelRating').onclick=()=>{state.pending=null;$('#downloadModal').classList.remove('show')};
$('#selfTest').onclick=systemTest;
setInterval(()=>{const tasks=readTasks(),now=Date.now();let changed=false;tasks.forEach(t=>{if(!t.alerted&&t.when<=now){t.alerted=true;changed=true;if('Notification' in window&&Notification.permission==='granted')new Notification(t.title,{body:t.message});}});if(changed)saveTasks(tasks)},30000);
buildCatNav();refreshCount();handleNav(navHash());
</script>
