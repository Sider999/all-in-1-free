function smartGenerate(t,text,tone){

 if(n.includes('twitter'))return `${clean}: one clear idea, one useful action, and one result worth measuring. Keep the message simple and let the evidence do the work.`;
 if(n.includes('rewrite')||n.includes('rephras')||n.includes('paraphras')||n.includes('humanizer')||n.includes('improver')||n.includes('shortener')){return clean.replace(/\bvery\b/gi,'quite').replace(/\butilize\b/gi,'use').replace(/\bin order to\b/gi,'to').replace(/\bdue to the fact that\b/gi,'because');}

 if(n.includes('cold email'))return `Subject: A practical idea about ${clean}\n\nHello,\n\nI am reaching out because ${clean} may be relevant to your current work. I can share a concise outline, examples, and the assumptions behind it.\n\nBest regards`;
 if(n.includes('translate'))return `Browser-local translation helper:\n\n${clean}\n\nFor reliable multilingual translation, connect an external translation API from your deployment settings.`;
 if(n.includes('explain it'))return `In simple terms, ${clean} means breaking a larger idea into smaller parts, identifying the main relationship, and checking one example to make sure the explanation holds.`;
 if(n.includes('title rewriter'))return `Practical Guide to ${clean}\nWhat You Need to Know About ${clean}\nA Clear Introduction to ${clean}\n${clean}: A Research-Based Overview`;
 if(n.includes('paragraph completer'))return clean+' This can be developed further by adding evidence, context, and a specific example that shows how the idea works in practice.';
 if(n.includes('story'))return `Title: ${clean}\n\nOnce the central problem became clear, the first step was simple: define the goal. The characters gathered the evidence, tested a small solution, learned from the result, and changed course when the first idea failed. By the end, the solution was less dramatic than expected, but much more useful.`;
 if(n.includes('youtube script'))return `Hook:\nToday we will look at ${clean}.\n\nContext:\nHere is the key idea viewers need first.\n\nMain points:\n1. What the problem is\n2. Why it matters\n3. A practical example\n\nClose:\nSummarize the main lesson and give viewers one action to try.`;

}

 if(t&&t.cat==='Write'){$('#run')?.addEventListener('click',()=>{try{const out=$('#out');out.classList.remove('hidden');out.innerHTML=`<pre style="white-space:pre-wrap;font:inherit">${esc(smartGenerate(t,$('#prompt').value,$('#tone').value))}</pre>`}catch(e){$('#out').classList.remove('hidden');$('#out').innerHTML=`<span class="bad">${esc(e.message)}</span>`}});$('#copy')?.addEventListener('click',async()=>{const txt=$('#out')?.innerText||'';if(txt)await navigator.clipboard.writeText(txt)})}
 if(t&&t.cat==='Web'){$('#openUrl')?.addEventListener('click',e=>{const u=$('#url').value.trim();if(!/^https?:\/\//i.test(u)){e.preventDefault();alert('Enter a valid http or https URL.')}else $('#openUrl').href=u});$('#run')?.addEventListener('click',()=>{const u=$('#url').value.trim(),o=$('#out');o.classList.remove('hidden');try{const x=new URL(u);o.innerHTML=`Valid URL: <span class="mono">${esc(x.href)}</span>`}catch{o.innerHTML='<span class="bad">Invalid URL</span>'}})}
 if(navHash()==='reminder'){$('#addTask')?.addEventListener('click',()=>{const tasks=JSON.parse(localStorage.getItem('reminderTasks')||'[]');if(tasks.length>=12)return alert('Maximum of 12 tasks reached.');const title=$('#taskTitle').value.trim();const days=Math.max(1,Math.min(30,Number($('#taskDays').value)||1));if(!title)return alert('Task title is required.');const task={id:Date.now(),title,days,message:$('#taskMsg').value.trim()||title,target:$('#target').value.trim(),when:Date.now()+days*86400000};tasks.push(task);saveTasks(tasks);location.hash='reminder'});$('#clearTasks')?.addEventListener('click',()=>{if(confirm('Delete all reminder tasks?')){saveTasks([]);location.hash='reminder'}});$('#notify')?.addEventListener('click',async()=>{if(!('Notification' in window))return alert('Browser notifications are not supported here.');const p=await Notification.requestPermission();alert(p==='granted'?'Browser notifications enabled.':'Notification permission was not granted.')});$$('[data-delete-task]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.deleteTask);const a=JSON.parse(localStorage.getItem('reminderTasks')||'[]').filter(x=>x.id!==id);saveTasks(a);location.hash='reminder'});$$('[data-alert-task]').forEach(a=>a.onclick=e=>{e.preventDefault();const id=Number(a.dataset.alertTask);const t=JSON.parse(localStorage.getItem('reminderTasks')||'[]').find(x=>x.id===id);if(t)alert(`${t.title}\\n\\n${t.message}`)})}
}
function navHash(){return location.hash.replace(/^#/,'')||'home'}
window.addEventListener('hashchange',()=>handleNav(navHash()));
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();state.query=q;if(!q){if(navHash()==='home')handleNav('home');return}const a=CATALOG.filter(t=>(t.name+' '+t.cat).toLowerCase().includes(q));$('#view').innerHTML=`<div class="page"><h1>Search results</h1><p class="sub">${a.length} match(es) for “${esc(q)}”.</p><div class="grid">${a.map(card).join('')}</div></div>`;attachView()});
$('#downloadModal').addEventListener('click',e=>{const s=e.target.closest('[data-star]');if(s){state.rating=Number(s.dataset.star);renderStars();$('#ratingText').textContent=`${state.rating} / 5 stars`;$('#confirmRating').disabled=false}});
$('#confirmRating').onclick=savePending;$('#cancelRating').onclick=()=>{state.pending=null;$('#downloadModal').classList.remove('show')};
function refreshCount(){let t=[];try{t=JSON.parse(localStorage.getItem('reminderTasks')||'[]')}catch{t=[]}$('#sideCount').textContent=`${t.length}/12`;const hc=$('#homeCount');if(hc)hc.textContent=`${t.length} / 12`}
setInterval(()=>{const tasks=JSON.parse(localStorage.getItem('reminderTasks')||'[]');tasks.forEach(t=>{if(!t.alerted&&t.when<=Date.now()&&'Notification' in window&&Notification.permission==='granted'){new Notification(t.title,{body:t.message});t.alerted=true}});if(tasks.some(t=>t.alerted))localStorage.setItem('reminderTasks',JSON.stringify(tasks))},60000);
refreshCount();handleNav(navHash());
</script>
