*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(40,245,255,.11),transparent 24%),radial-gradient(circle at 90% 10%,rgba(139,92,246,.14),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:40;background:rgba(7,9,20,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}.nav{max-width:1450px;margin:auto;display:flex;gap:14px;align-items:center;padding:14px 20px}.brand{font-weight:900;letter-spacing:.3px;display:flex;align-items:center;gap:10px;min-width:max-content}.brand-dot{width:15px;height:15px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan),0 0 32px rgba(40,245,255,.55)}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a,.navbtn{padding:9px 12px;border:1px solid transparent;border-radius:11px;color:var(--muted)}.navlinks a:hover,.navbtn:hover{color:#fff;border-color:#293257;background:#11162a}.spacer{flex:1}.shell{max-width:1450px;margin:auto;padding:24px 20px 70px}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:stretch;margin-top:8px}.hero-card,.panel,.tool-card,.cat-card,.stat,.task{background:linear-gradient(145deg,rgba(17,22,43,.94),rgba(9,13,27,.94));border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px}.hero-card{padding:34px;position:relative;overflow:hidden}.hero-card:after{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,216,.24),transparent 64%);pointer-events:none}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.7px;color:var(--cyan);font-weight:800}.hero h1{font-size:clamp(36px,6vw,70px);line-height:.98;margin:12px 0 16px}.gradient{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;max-width:800px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--line);background:#10162b;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}.btn.primary{background:linear-gradient(90deg,#10d9e5,#7b61ff);border-color:transparent}.btn.gold{background:linear-gradient(90deg,#b98b18,#ffd166);color:#211500;border-color:#f7ca54}.btn.danger{color:#ff9aaa}.btn.ghost{background:transparent}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:20px}.stat b{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}.section{margin-top:24px}.section-head{display:flex;gap:12px;align-items:end;justify-content:space-between;margin-bottom:12px}.section-head h2{margin:0;font-size:25px}.muted{color:var(--muted)}.search{display:flex;gap:10px;align-items:center;background:#0d1122;border:1px solid var(--line);border-radius:14px;padding:6px 10px;min-width:310px}.search input{border:0;outline:0;background:transparent;color:#fff;width:100%;padding:8px}.cat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.cat-card{padding:16px;text-align:left;transition:.18s transform,.18s border-color}.cat-card:hover{transform:translateY(-2px);border-color:#4b5ba0}.cat-card strong{display:block;font-size:17px}.cat-card span{color:var(--muted);font-size:13px}.tools-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tool-card{padding:17px;display:flex;flex-direction:column;min-height:196px}.ic{font-size:27px}.tool-card h3{font-size:17px;margin:9px 0 7px}.tool-card p{font-size:13px;line-height:1.55;color:var(--muted);flex:1}.meta{font-size:12px;color:#8d98b6}.row{display:flex;align-items:center;gap:8px}.view{min-height:60vh}.workspace{max-width:1050px;margin:28px auto}.panel{padding:22px}.workspace-head{display:flex;gap:15px;justify-content:space-between;align-items:start;margin-bottom:16px}.workspace h1{margin:0 0 8px;font-size:34px}.workspace .desc{color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#cbd4ed;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#090d1c;color:#fff;border-radius:12px;padding:11px 12px;outline:none}.field textarea{min-height:170px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#5367c0;box-shadow:0 0 0 3px rgba(83,103,192,.16)}.drop{padding:22px;border:1px dashed #3b4670;border-radius:14px;background:#090d1c;text-align:center}.result{margin-top:16px;border:1px solid var(--line);background:#090d1c;border-radius:14px;padding:14px;overflow:auto}.result pre{white-space:pre-wrap;word-break:break-word;margin:0}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:12px;background:rgba(40,245,255,.07);border:1px solid rgba(40,245,255,.22);color:#c8fbff;margin-top:12px}.error{background:rgba(255,93,115,.08);border-color:rgba(255,93,115,.28);color:#ffc1ca}.success{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.28);color:#c9ffd9}.task{padding:16px;margin-top:12px}.task-top{display:flex;justify-content:space-between;gap:10px}.links{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}.links a{padding:8px 10px;border-radius:10px;background:#121933;border:1px solid #2a355a;color:#cfd8f4;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.footer{color:#77819e;text-align:center;padding:25px}.rating-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.74);display:grid;place-items:center;z-index:100}.rating{width:min(480px,calc(100vw - 30px));padding:25px;background:#0e1327;border:1px solid #344063;border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.55);text-align:center}.stars{display:flex;justify-content:center;gap:7px;margin:18px 0}.star{font-size:34px;background:transparent;border:0;color:#4d5877}.star.active{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.6)}.small{font-size:12px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:1100px){.tools-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media(max-width:760px){.nav{align-items:flex-start;flex-wrap:wrap}.navlinks{order:3;width:100%;overflow:auto}.shell{padding-inline:14px}.tools-grid{grid-template-columns:1fr 1fr}.cat-grid{grid-template-columns:1fr 1fr}.search{min-width:0;width:100%}.section-head{align-items:stretch;flex-direction:column}.fields{grid-template-columns:1fr}}
@media(max-width:480px){.tools-grid,.cat-grid,.stats{grid-template-columns:1fr}.hero-card{padding:23px}.panel{padding:16px}}

<script>
'use strict';
if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
const CATALOG=[
['jpg-to-pdf','JPG to PDF','PDF'],['merge-pdf','Merge PDF','PDF'],['create-pdf','Create PDF','PDF'],['pdf-to-jpg','PDF to JPG','PDF'],['extract-text-from-pdf','Extract Text from PDF','PDF'],['pdf-to-png','PDF to PNG','PDF'],['gif-to-pdf','GIF to PDF','PDF'],['webp-to-pdf','WebP to PDF','PDF'],['tiff-to-pdf','TIFF to PDF','PDF'],['pdf-to-text','PDF to Text','PDF'],
['resize-dimensions','Resize Dimensions','Image'],['compress-image','Compress Image','Image'],['combine-images','Combine Images','Image'],['collage-maker','Collage Maker','Image'],['chart-maker','Chart Maker','Image'],['crop-image','Crop Image','Image'],['add-border-to-image','Add Border to Image','Image'],['add-text-to-image','Add Text to Image','Image'],['pixelate-image','Pixelate Image','Image'],['make-round-image','Make Round Image','Image'],['black-white','Black & White','Image'],['flip-image','Flip Image','Image'],['webp-to-jpg','WebP to JPG','Image'],['png-to-jpg','PNG to JPG','Image'],['webp-to-png','WEBP to PNG','Image'],['jpg-to-png','JPG to PNG','Image'],['png-to-webp','PNG to WEBP','Image'],['jpg-to-webp','JPG to WEBP','Image'],['svg-to-png','SVG to PNG','Image'],
['content-improver','Content Improver','Write'],['essay-writer','Essay Writer','Write'],['paragraph-writer','Paragraph Writer','Write'],['paragraph-completer','Paragraph Completer','Write'],['story-generator','Story Generator','Write'],['grammar-fixer','Grammar Fixer','Write'],['article-writer','Article Writer','Write'],['sentence-rewriter','Sentence Rewriter','Write'],['content-summarizer','Content Summarizer','Write'],['tone-of-voice','Tone of Voice','Write'],['paragraph-rewriter','Paragraph Rewriter','Write'],['content-shortener','Content Shortener','Write'],['title-rewriter','Title Rewriter','Write'],['business-name-generator','Business Name Generator','Write'],['content-paraphraser','Content Paraphraser','Write'],['blog-post-ideas','Blog Post Ideas','Write'],['business-plan-generator','Business Plan Generator','Write'],['word-counter','Word Counter','Write'],
['split-csv','Split CSV','File'],['csv-to-excel','CSV to Excel','File'],['xml-to-csv','XML to CSV','File'],['xml-to-json','XML to JSON','File'],['json-to-xml','JSON to XML','File'],['csv-to-excel-converter','CSV to Excel Converter','File'],['excel-to-csv-converter','Excel to CSV Converter','File'],['csv-to-json-converter','CSV to JSON Converter','File'],['xml-to-csv-converter','XML to CSV Converter','File'],['create-zip','Create ZIP','File'],
['qr-code-generator','QR Code Generator','Other'],['lorem-ipsum-generator','Lorem Ipsum Generator','Other'],['meme-maker','Meme Maker','Other'],['epoch-converter','Epoch Converter','Other'],
];
const TOOLS=CATALOG.map(([id,name,cat])=>({id,name,cat}));
const byId=Object.fromEntries(TOOLS.map(t=>[t.id,t]));
const icons={PDF:'📄',Image:'🖼️',Write:'✍️',File:'🗂️',Other:'🧰'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function saveBlob(blob,name){return new Promise((resolve,reject)=>{if(!blob){reject(new Error('No output was generated.'));return} showRating(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);resolve()},name)})}
let selectedRating=0;
function showRating(cb,name){const root=$('#modalRoot');root.innerHTML=`<div class="rating-backdrop"><div class="rating"><div class="eyebrow">Download confirmation</div><h2>Rate this tool</h2><p class="muted">Choose a star rating before saving <b>${esc(name)}</b>.</p><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star" data-star="${i}">★</button>`).join('')}</div><div class="small muted">Your rating is stored only in this browser.</div><div class="toolbar" style="justify-content:center"><button class="btn ghost" id="cancelRate">Cancel</button><button class="btn gold" id="confirmRate" disabled>Save file</button></div></div></div>`;selectedRating=0;root.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{selectedRating=+b.dataset.star;root.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('active',+x.dataset.star<=selectedRating));$('#confirmRate').disabled=false});$('#cancelRate').onclick=()=>root.innerHTML='';$('#confirmRate').onclick=()=>{localStorage.setItem('lastDownloadRating',String(selectedRating));root.innerHTML='';cb()}}
function msg(text,good=false){const o=$('#out');if(!o)return;o.className='result '+(good?'success':'');o.innerHTML=esc(text)}
function showHtml(html,good=false){const o=$('#out');if(!o)return;o.className='result '+(good?'success':'');o.innerHTML=html}
function fileInput(multiple=true,accept=''){return `<div class="field full"><label>Select file${multiple?'s':''}</label><input id="files" type="file" ${multiple?'multiple':''} ${accept?`accept="${accept}"`:''}></div>`}
function textField(label='Text',id='text',ph='',rows=10){return `<div class="field full"><label>${label}</label><textarea id="${id}" placeholder="${esc(ph)}" rows="${rows}"></textarea></div>`}
function baseWorkspace(t,fields,help=''){return `<section class="workspace"><div class="workspace-head"><div><div class="eyebrow">${icons[t.cat]} ${t.cat} tool</div><h1>${esc(t.name)}</h1><div class="desc">${esc(help||description(t))}</div></div><a class="btn ghost" href="#cat:${encodeURIComponent(t.cat)}">Back to ${esc(t.cat)}</a></div><div class="panel"><div class="fields">${fields}</div><div class="toolbar"><button class="btn primary" id="run">Run tool</button><button class="btn ghost" id="reset" onclick="handle()">Reset</button></div><div id="out" class="result hidden"></div></div></section>`}
function description(t){if(t.cat==='PDF')return 'Local PDF processing using browser libraries where required.';if(t.cat==='Image')return 'Local image processing with Canvas. No upload to a server.';if(t.cat==='Write')return 'Deterministic writing utility that runs locally in your browser.';if(t.cat==='File')return 'Local file and data conversion without server upload.';return 'Local browser utility.'}
function home(){return `<section class="hero"><div class="hero-card"><div class="eyebrow">${TOOLS.length} working browser tools</div><div class="hero"><div><h1>One place for <span class="gradient">useful work.</span></h1><p>Every listed tool in this build has a concrete client-side handler. Unsupported server-only categories are intentionally excluded. Browse the genres below or search the full catalog.</p><div class="actions"><a class="btn primary" href="#cat:PDF">Explore PDF</a><a class="btn" href="#cat:Image">Explore Images</a><a class="btn gold" href="#reminder">30-Day Reminders</a></div></div></div></div><div class="stats"><div class="stat"><b>${TOOLS.length}</b><span>working catalog tools</span></div><div class="stat"><b>${new Set(TOOLS.map(t=>t.cat)).size}</b><span>tool genres</span></div><div class="stat"><b>12</b><span>maximum reminder tasks</span></div><div class="stat"><b>Local</b><span>browser-first processing</span></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Browse by genre</div><h2>Tool categories</h2></div></div><div class="cat-grid">${['PDF','Image','Write','File','Other'].map(cat=>`<button class="cat-card" onclick="location.hash='cat:${cat}'"><strong>${icons[cat]} ${cat}</strong><span>${TOOLS.filter(t=>t.cat===cat).length} tools</span></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Complete catalog</div><h2>All tools</h2></div><div class="search"><span>⌕</span><input id="homeSearch" placeholder="Search tools..."></div></div><div id="homeTools" class="tools-grid">${TOOLS.map(card).join('')}</div></section>`}
function card(t){return `<article class="tool-card" data-name="${esc(slug(t.name))}" data-cat="${esc(t.cat)}"><div class="ic">${icons[t.cat]}</div><h3>${esc(t.name)}</h3><p>${esc(description(t))}</p><div class="row"><span class="meta">${esc(t.cat)} · Local</span><span style="flex:1"></span><a class="btn primary" href="#tool:${t.id}">Open</a></div></article>`}
function category(cat){const list=TOOLS.filter(t=>t.cat===cat);return `<section class="section"><div class="section-head"><div><div class="eyebrow">Genre</div><h2>${icons[cat]} ${esc(cat)} tools</h2><div class="muted">${list.length} working tools in this genre.</div></div><div class="search"><span>⌕</span><input id="catSearch" placeholder="Search ${esc(cat)} tools..."></div></div><div id="catTools" class="tools-grid">${list.map(card).join('')}</div></section>`}
function reminder(){const tasks=getTasks();return `<section class="workspace"><div class="workspace-head"><div><div class="eyebrow">⭐ Gold dashboard</div><h1>30-Day Multi-Task Reminder Suite</h1><div class="desc">Schedule up to 12 tasks for 1 to 30 days. Tasks persist in LocalStorage.</div></div><span class="btn gold">${tasks.length}/12</span></div><div class="panel"><div class="fields"><div class="field"><label>Task title</label><input id="rtTitle" placeholder="Pay utility bill"></div><div class="field"><label>Days from now</label><input id="rtDays" type="number" min="1" max="30" value="1"></div><div class="field full"><label>Message</label><textarea id="rtMessage" placeholder="Reminder message"></textarea></div><div class="field"><label>Phone for WhatsApp / SMS</label><input id="rtPhone" placeholder="923001234567"></div><div class="field"><label>Email for mail trigger</label><input id="rtEmail" type="email" placeholder="name@example.com"></div></div><div class="toolbar"><button class="btn gold" id="addReminder">Add task</button><button class="btn" id="notifyBtn">Enable browser notifications</button><button class="btn danger" id="clearReminders">Clear all</button></div><div id="taskList"></div></div></section>`}
function getTasks(){try{const x=JSON.parse(localStorage.getItem('reminderTasks')||'[]');return Array.isArray(x)?x.filter(t=>t&&t.when):[]}catch{return []}}
function setTasks(x){localStorage.setItem('reminderTasks',JSON.stringify(x));}
function renderTasks(){const list=$('#taskList');if(!list)return;const tasks=getTasks();list.innerHTML=tasks.length?tasks.map(t=>{const d=new Date(t.when),phone=String(t.phone||'').replace(/[^0-9+]/g,''),wa=phone?`https://wa.me/${phone.replace('+','')}?text=${encodeURIComponent(t.message||t.title)}`:'#',sms=phone?`sms:${encodeURIComponent(phone)}?body=${encodeURIComponent(t.message||t.title)}`:'#',mail=t.email?`mailto:${encodeURIComponent(t.email)}?subject=${encodeURIComponent(t.title)}&body=${encodeURIComponent(t.message||t.title)}`:'#';return `<div class="task"><div class="task-top"><div><b>${esc(t.title)}</b><div class="muted small">${esc(d.toLocaleString())}</div></div><button class="btn danger" data-delete="${t.id}">Delete</button></div><div style="margin-top:8px">${esc(t.message||'')}</div><div class="links"><a href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a href="${sms}">SMS</a><a href="${mail}">Email</a><a href="#" data-alert="${t.id}">Browser Alert</a></div></div>`}).join(''):'<div class="notice">No scheduled tasks yet.</div>';list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{setTasks(getTasks().filter(t=>String(t.id)!==String(b.dataset.delete)));renderTasks();location.hash='reminder'});list.querySelectorAll('[data-alert]').forEach(b=>b.onclick=e=>{e.preventDefault();const t=getTasks().find(x=>String(x.id)===String(b.dataset.alert));if(t)alert(`${t.title}\n\n${t.message||''}\n\nScheduled: ${new Date(t.when).toLocaleString()}`)})}
async function setupReminder(){renderTasks();$('#addReminder').onclick=()=>{const tasks=getTasks();if(tasks.length>=12){msg('Maximum 12 reminder tasks allowed.');return}const title=$('#rtTitle').value.trim();const days=Number($('#rtDays').value);if(!title||!Number.isInteger(days)||days<1||days>30){msg('Enter a task title and a whole number from 1 to 30 days.');return}const when=Date.now()+days*86400000;tasks.push({id:Date.now()+Math.random(),title,message:$('#rtMessage').value.trim(),days,when,phone:$('#rtPhone').value.trim(),email:$('#rtEmail').value.trim()});setTasks(tasks);$('#rtTitle').value='';$('#rtMessage').value='';renderTasks()};$('#clearReminders').onclick=()=>{setTasks([]);renderTasks()};$('#notifyBtn').onclick=async()=>{if(!('Notification' in window)){msg('This browser does not support notifications.');return}const p=await Notification.requestPermission();msg(p==='granted'?'Browser notifications enabled.':'Notification permission was not granted.',p==='granted')};}
function bindSearch(inputId,cardId){const inp=$(inputId),wrap=$(cardId);if(!inp||!wrap)return;inp.oninput=()=>{const q=slug(inp.value);wrap.querySelectorAll('.tool-card').forEach(c=>c.style.display=(!q||c.dataset.name.includes(q))?'':'none')}}
async function toolPage(t){const s=slug(t.name);if(t.cat==='PDF')return renderPDFTool(t,s);if(t.cat==='Image')return renderImageTool(t,s);if(t.cat==='Write')return renderWriteTool(t,s);if(t.cat==='File')return renderFileTool(t,s);return renderOtherTool(t,s)}
function renderPDFTool(t,s){let f='';if(s.includes('merge pdf'))f=fileInput(true,'.pdf');else if(s.includes('create pdf'))f=textField('Text to place into the PDF','prompt','Write text here...',12);else f=fileInput(s.includes('jpg')||s.includes('png')||s.includes('gif')||s.includes('webp')||s.includes('tiff'),s.includes('pdf')?'application/pdf':(s.includes('svg')?'image/svg+xml,.svg':'image/*'));if(s.includes('pdf to jpg')||s.includes('pdf to png'))f+=`<div class="field"><label>Page number</label><input id="page" type="number" min="1" value="1"></div>`;$('#view').innerHTML=baseWorkspace(t,f);$('#run').onclick=()=>runPDF(t);}
function renderImageTool(t,s){let f=fileInput(false,'image/*');let extras='';if(s.includes('resize'))extras+=`<div class="field"><label>Width</label><input id="w" type="number" min="1" value="1200"></div><div class="field"><label>Height</label><input id="h" type="number" min="1" value="800"></div>`;if(s.includes('compress'))extras+=`<div class="field"><label>JPEG quality (10-100)</label><input id="quality" type="number" min="10" max="100" value="70"></div>`;if(s.includes('crop'))extras+=`<div class="field"><label>Crop X</label><input id="x" type="number" min="0" value="0"></div><div class="field"><label>Crop Y</label><input id="y" type="number" min="0" value="0"></div><div class="field"><label>Crop Width</label><input id="cw" type="number" min="1" value="800"></div><div class="field"><label>Crop Height</label><input id="ch" type="number" min="1" value="600"></div>`;if(s.includes('border'))extras+=`<div class="field"><label>Border px</label><input id="border" type="number" min="1" value="20"></div>`;if(s.includes('add text'))extras+=`<div class="field full"><label>Text</label><input id="imgText" value="Sample text"></div>`;if(s.includes('pixelate'))extras+=`<div class="field"><label>Pixel size</label><input id="pixel" type="number" min="2" value="16"></div>`;if(s.includes('combine images')||s.includes('collage'))f=fileInput(true,'image/*');if(s.includes('chart')){f='';extras=`<div class="field full"><label>Chart data</label><textarea id="chartData" rows="7" placeholder="Jan,10\nFeb,18\nMar,14"></textarea></div>`}$('#view').innerHTML=baseWorkspace(t,f+extras);$('#run').onclick=()=>runImage(t);}
function renderWriteTool(t,s){let ph='Paste your text here...';if(s.includes('essay'))ph='Topic and requirements...';if(s.includes('business name'))ph='Describe the business, niche, audience, style...';if(s.includes('blog post ideas'))ph='Give a niche or topic...';if(s.includes('business plan'))ph='Describe the business idea...';let fields=textField('Input','prompt',ph,12);if(s.includes('tone of voice'))fields+=`<div class="field"><label>Target tone</label><select id="tone"><option>Professional</option><option>Friendly</option><option>Academic</option><option>Persuasive</option><option>Concise</option></select></div>`;$('#view').innerHTML=baseWorkspace(t,fields);$('#run').onclick=()=>runWrite(t);}
function renderFileTool(t,s){let f=fileInput(true);if(s.includes('csv to json')||s.includes('json to xml'))f+=textField('Or paste text','prompt','Paste data here...',10);if(s.includes('split csv'))f+=`<div class="field"><label>Rows per part</label><input id="chunk" type="number" min="1" value="100"></div>`;$('#view').innerHTML=baseWorkspace(t,f);$('#run').onclick=()=>runFile(t);}
function renderOtherTool(t,s){let f='';if(s.includes('qr'))f=textField('QR text','text','https://example.com',5);else if(s.includes('lorem'))f=`<div class="field"><label>Paragraphs</label><input id="count" type="number" min="1" max="50" value="3"></div>`;else if(s.includes('meme'))f=fileInput(false,'image/*')+`<div class="field"><label>Top text</label><input id="top" value="Top text"></div><div class="field"><label>Bottom text</label><input id="bottom" value="Bottom text"></div>`;else f=`<div class="field"><label>Mode</label><select id="mode"><option>Epoch → Date</option><option>Date → Epoch</option></select></div><div class="field"><label>Value</label><input id="value" value="0"></div>`;$('#view').innerHTML=baseWorkspace(t,f);$('#run').onclick=()=>runOther(t);}
function readerToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Browser could not decode the selected image.'))};im.src=u})}
async function imageCanvas(file,{w,h,x=0,y=0,cw,ch,gray=false,flip=false,pixel=0,border=0,text='',round=false}={}){const im=await loadImage(file);w=w||im.naturalWidth;h=h||im.naturalHeight;const c=document.createElement('canvas');c.width=w+border*2;c.height=h+border*2;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.save();if(flip)ctx.translate(c.width,0),ctx.scale(-1,1);ctx.drawImage(im, x,y,cw||im.naturalWidth,ch||im.naturalHeight,border,border,w,h);ctx.restore();if(gray){const d=ctx.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const v=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];p[i]=p[i+1]=p[i+2]=v}ctx.putImageData(d,0,0)}if(pixel){const small=document.createElement('canvas');small.width=Math.max(1,Math.floor(c.width/pixel));small.height=Math.max(1,Math.floor(c.height/pixel));small.getContext('2d').drawImage(c,0,0,small.width,small.height);ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,c.width,c.height)}if(round){ctx.globalCompositeOperation='destination-in';ctx.beginPath();ctx.arc(c.width/2,c.height/2,Math.min(c.width,c.height)/2,0,Math.PI*2);ctx.fill()}if(text){ctx.font='700 46px Arial';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#000';ctx.fillStyle='#fff';ctx.strokeText(text,c.width/2,70);ctx.fillText(text,c.width/2,70)}return c}
function canvasBlob(c,type='image/png',quality=.92){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Browser could not encode the image.')),type,quality))}
async function runImage(t){try{const s=slug(t.name),files=$('#files')?.files;if(s.includes('chart')){const rows=$('#chartData').value.split(/\r?\n/).map(x=>x.split(','));const c=document.createElement('canvas');c.width=1000;c.height=620;const ctx=c.getContext('2d');ctx.fillStyle='#0b1022';ctx.fillRect(0,0,c.width,c.height);const vals=rows.map(r=>Number(r[1])).filter(Number.isFinite);const max=Math.max(1,...vals),bw=700/Math.max(1,vals.length);rows.forEach((r,i)=>{const v=Number(r[1])||0,h=450*v/max,x=150+i*bw;ctx.fillStyle='#28f5ff';ctx.fillRect(x,540-h,bw*.55,h);ctx.fillStyle='#eef3ff';ctx.font='16px Arial';ctx.fillText(r[0]||'',x,575);ctx.fillText(String(v),x,530-h)});await saveBlob(await canvasBlob(c,'image/png'),'chart.png');return}if(s.includes('combine images')||s.includes('collage')){if(!files?.length)throw new Error('Select at least one image.');const ims=await Promise.all([...files].map(loadImage));const cols=Math.ceil(Math.sqrt(ims.length)),cell=420,rows=Math.ceil(ims.length/cols),c=document.createElement('canvas');c.width=cols*cell;c.height=rows*cell;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);ims.forEach((im,i)=>{const px=(i%cols)*cell,py=Math.floor(i/cols)*cell,r=Math.min((cell-20)/im.naturalWidth,(cell-20)/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;x.drawImage(im,px+(cell-w)/2,py+(cell-h)/2,w,h)});await saveBlob(await canvasBlob(c,'image/jpeg'),'image-collage.jpg');return}if(!files?.length)throw new Error('Select an image.');const im=await loadImage(files[0]);let type='image/png',ext='png';if(s.includes('jpg'))type='image/jpeg',ext='jpg';if(s.includes('webp'))type='image/webp',ext='webp';let c;if(s.includes('resize'))c=await imageCanvas(files[0],{w:Number($('#w').value),h:Number($('#h').value)});else if(s.includes('crop'))c=await imageCanvas(files[0],{w:Number($('#cw').value),h:Number($('#ch').value),x:Number($('#x').value),y:Number($('#y').value),cw:Number($('#cw').value),ch:Number($('#ch').value)});else if(s.includes('border'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,border:Number($('#border').value)});else if(s.includes('pixelate'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,pixel:Number($('#pixel').value)});else if(s.includes('round'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,round:true});else if(s.includes('black'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,gray:true});else if(s.includes('flip'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,flip:true});else if(s.includes('add text'))c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight,text:$('#imgText').value});else c=await imageCanvas(files[0],{w:im.naturalWidth,h:im.naturalHeight});if(s.includes('compress')){const q=Math.max(.1,Math.min(1,(Number($('#quality').value)||70)/100));await saveBlob(await canvasBlob(c,'image/jpeg',q),'compressed.jpg')}else{await saveBlob(await canvasBlob(c,type),'processed.'+ext)}}catch(e){msg(e.message||String(e))}}
async function runPDF(t){try{const s=slug(t.name),files=$('#files')?.files;if(s.includes('create pdf')){const {jsPDF}=window.jspdf||{};if(!jsPDF)throw new Error('PDF library failed to load.');const doc=new jsPDF();const lines=doc.splitTextToSize($('#prompt').value||'',170);doc.text(lines,20,25);await saveBlob(doc.output('blob'),'created.pdf');return}if(s.includes('merge pdf')){if(!window.PDFLib)throw new Error('PDF library failed to load.');if(!files||files.length<2)throw new Error('Select at least two PDF files.');const out=await PDFLib.PDFDocument.create();for(const f of files){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p))}await saveBlob(new Blob([await out.save()],{type:'application/pdf'}),'merged.pdf');return}if(s.includes('jpg to pdf')||s.includes('gif to pdf')||s.includes('webp to pdf')||s.includes('tiff to pdf')){if(!files?.length)throw new Error('Select image file(s).');const {jsPDF}=window.jspdf||{};if(!jsPDF)throw new Error('PDF library failed to load.');const doc=new jsPDF({unit:'pt',format:'a4'});for(let i=0;i<files.length;i++){const im=await loadImage(files[i]),r=Math.min(545/im.naturalWidth,790/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r,c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);if(i)doc.addPage();const data=c.toDataURL('image/jpeg',.92);doc.addImage(data,'JPEG',35,35,w,h)}await saveBlob(doc.output('blob'),'images.pdf');return}if(s.includes('pdf to jpg')||s.includes('pdf to png')||s.includes('extract text')||s.includes('pdf to text')){if(!files?.length)throw new Error('Select a PDF file.');if(!window.pdfjsLib)throw new Error('PDF.js failed to load.');const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await files[0].arrayBuffer())}).promise;if(s.includes('extract')||s.includes('text')){let out='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();out+=`\n\n--- Page ${i} ---\n`+content.items.map(x=>x.str).join(' ')}const extracted=out.trim();showHtml(`<pre>${esc(extracted)}</pre><div class="toolbar"><button class="btn primary" id="downloadText">Download text</button></div>`,true);$('#downloadText').onclick=()=>saveBlob(new Blob([extracted],{type:'text/plain'}),'extracted.txt');return}const pn=Math.max(1,Math.min(pdf.numPages,Number($('#page').value)||1)),page=await pdf.getPage(pn),vp=page.getViewport({scale:1.7}),c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const type=s.includes('png')?'image/png':'image/jpeg';await saveBlob(await canvasBlob(c,type,.92),`page-${pn}.${s.includes('png')?'png':'jpg'}`);return}throw new Error('Unsupported PDF operation.')}catch(e){msg(e.message||String(e))}}
function words(text){return text.trim()?text.trim().split(/\s+/).length:0}
function sentenceCase(s){return s.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase())}
function runWrite(t){try{const s=slug(t.name),input=$('#prompt').value.trim();if(s.includes('word counter')){showHtml(`<b>${words(input)}</b> words · <b>${input ? input.length : 0}</b> characters`);return}if(!input)throw new Error('Enter some text first.');let out=input;if(s.includes('grammar fixer'))out=sentenceCase(input).replace(/\s{2,}/g,' ');else if(s.includes('content shortener'))out=input.split(/\s+/).slice(0,Math.max(30,Math.ceil(words(input)*.55))).join(' ') + (words(input)>30?'…':'');else if(s.includes('content summarizer'))out=input.split(/(?<=[.!?])\s+/).slice(0,3).join(' ');else if(s.includes('sentence rewriter')||s.includes('paragraph rewriter'))out=input.replace(/\bvery\b/gi,'highly').replace(/\buse\b/gi,'utilize');else if(s.includes('paraphraser'))out=input.replace(/\bbecause\b/gi,'since').replace(/\bhelp\b/gi,'assist').replace(/\bimportant\b/gi,'significant');else if(s.includes('tone of voice')){const tone=$('#tone').value;out=tone==='Academic'?`Academic version:\n${sentenceCase(input)}`:tone==='Professional'?`Professional version:\n${sentenceCase(input)}`:tone==='Friendly'?`Friendly version:\n${sentenceCase(input)}`:tone==='Persuasive'?`Persuasive version:\n${sentenceCase(input)}`:`Concise version:\n${input.split(/\s+/).slice(0,40).join(' ')}`;}else if(s.includes('business name'))out=['NovaNest','BrightForge','PrimePilot','Veridian Works','Nexora Labs','BluePeak Studio'].join('\n');else if(s.includes('blog post ideas'))out=['How to get started with '+input,'Common mistakes in '+input,'A practical guide to '+input,'Best strategies for '+input,'What beginners should know about '+input].join('\n');else if(s.includes('essay writer'))out=`Introduction\n\n${input}\n\nMain discussion\n\nThis section develops the central arguments, supporting evidence, examples, and implications of the topic.\n\nConclusion\n\nThe discussion shows why the topic matters and how its key points can be understood in practice.`;else if(s.includes('paragraph completer'))out=input+' This idea can be developed further by considering its practical context, supporting evidence, and likely implications.';else if(s.includes('story generator'))out=`The story begins with ${input}. A small decision changes the direction of the day, forcing the main character to choose between comfort and curiosity. The choice opens a path toward a problem that can only be solved through patience, observation, and courage.`;else if(s.includes('article writer'))out=`# ${input}\n\nIntroduction\n${input} deserves careful attention because it affects decisions, practice, and outcomes in everyday life.\n\nKey points\nThe most useful way to approach the subject is to define the problem, examine reliable evidence, compare practical options, and identify the consequences.\n\nConclusion\nA clear understanding of ${input} helps readers make better informed decisions.`;else if(s.includes('title rewriter'))out=input.replace(/\.$/,'')+' | A Practical Guide';else if(s.includes('business plan'))out=`Business Plan\n\nIdea: ${input}\n\nProblem: Define the customer problem clearly.\nSolution: Describe the product or service and why it solves the problem.\nMarket: Identify target customers and alternatives.\nRevenue: Define pricing and sales channels.\nOperations: Outline people, process, tools, and delivery.\nRisks: List major assumptions and mitigation steps.`;else if(s.includes('content improver'))out=sentenceCase(input).replace(/\s{2,}/g,' ').replace(/\bthing\b/gi,'factor');else if(s.includes('paragraph writer'))out=`${sentenceCase(input)}. This paragraph explains the central point, gives context, and connects the idea to a practical outcome. It can be expanded with evidence, examples, and specific details.`;else if(s.includes('title'))out=input.split(/\s+/).slice(0,12).join(' ');else out=input;showHtml(`<pre>${esc(out)}</pre>`);$('#out').dataset.text=out}catch(e){msg(e.message||String(e))}}
function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],n=text[i+1];if(ch==='"'&&q&&n==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x!==''))rows.push(row);row=[];continue}cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x!==''))rows.push(row)}return rows}
function csvString(rows){return rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
function xmlEscape(v){return String(v??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}
function objectToXml(o,root='root'){if(Array.isArray(o))return `<${root}>${o.map(x=>objectToXml(x,'item')).join('')}</${root}>`;if(o&&typeof o==='object')return `<${root}>${Object.entries(o).map(([k,v])=>objectToXml(v,k.replace(/[^a-zA-Z0-9_-]/g,'_')||'item')).join('')}</${root}>`;return `<${root}>${xmlEscape(o)}</${root}>`}
async function runFile(t){try{const s=slug(t.name),f=$('#files')?.files?.[0];let text=$('#prompt')?.value||'';if(f&&!text){if(f.name.toLowerCase().endsWith('.xlsx')&&window.XLSX){const wb=XLSX.read(await f.arrayBuffer()),ws=wb.Sheets[wb.SheetNames[0]];text=XLSX.utils.sheet_to_csv(ws)}else text=await f.text()}if(s.includes('create zip')){const z=new JSZip();for(const file of ($('#files')?.files||[]))z.file(file.name,file);if(!f&&!text)throw new Error('Select a file.');if(!f)z.file('data.txt',text);await saveBlob(await z.generateAsync({type:'blob'}),'archive.zip');return}if(!text)throw new Error('Provide a file or paste data.');if(s.includes('csv')&&s.includes('json')){const rows=parseCsv(text),h=rows.shift()||[],a=rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));await saveBlob(new Blob([JSON.stringify(a,null,2)],{type:'application/json'}),'converted.json');return}if(s.includes('json to xml')){await saveBlob(new Blob([objectToXml(JSON.parse(text))],{type:'application/xml'}),'converted.xml');return}if(s.includes('xml to json')){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid XML.');await saveBlob(new Blob([JSON.stringify({root:doc.documentElement.textContent},null,2)],{type:'application/json'}),'converted.json');return}if(s.includes('xml to csv')){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('Invalid XML.');const nodes=[...doc.documentElement.children];const rows=[['name','value'],...nodes.map(n=>[n.tagName,n.textContent])];await saveBlob(new Blob([csvString(rows)],{type:'text/csv'}),'converted.csv');return}if(s.includes('csv to excel')){if(!window.XLSX)throw new Error('Excel library failed to load.');const ws=XLSX.utils.aoa_to_sheet(parseCsv(text)),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');await saveBlob(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'converted.xlsx');return}if(s.includes('excel to csv')){if(!window.XLSX||!f)throw new Error('Select an Excel file.');const wb=XLSX.read(await f.arrayBuffer()),ws=wb.Sheets[wb.SheetNames[0]];await saveBlob(new Blob([XLSX.utils.sheet_to_csv(ws)],{type:'text/csv'}),'converted.csv');return}if(s.includes('split csv')){const rows=parseCsv(text),chunk=Math.max(1,Number($('#chunk').value)||100);const z=new JSZip();for(let i=0,p=1;i<rows.length;i+=chunk,p++)z.file(`part-${p}.csv`,csvString(rows.slice(i,i+chunk)));await saveBlob(await z.generateAsync({type:'blob'}),'csv-parts.zip');return}showHtml(`<pre>${esc(text.slice(0,30000))}</pre>`)}catch(e){msg(e.message||String(e))}}
async function runOther(t){try{const s=slug(t.name);if(s.includes('qr')){if(!window.QRCode)throw new Error('QR library failed to load.');const o=$('#out');o.className='result';o.innerHTML='';new QRCode(o,{text:$('#text').value||'All-in-1 Free Tools',width:280,height:280,correctLevel:QRCode.CorrectLevel.H});return}if(s.includes('lorem')){const count=Math.max(1,Math.min(50,Number($('#count').value)||3));const p='Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer facilisis sapien at posuere volutpat.';showHtml(`<pre>${esc(Array.from({length:count},()=>p).join('\n\n'))}</pre>`);return}if(s.includes('meme')){const f=$('#files')?.files?.[0];if(!f)throw new Error('Select an image.');const im=await loadImage(f),c=document.createElement('canvas');c.width=1200;c.height=800;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);ctx.font='700 54px Impact,Arial';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.fillStyle='#fff';for(const [txt,y] of [[($('#top').value||'').toUpperCase(),75],[($('#bottom').value||'').toUpperCase(),750]]){ctx.strokeText(txt,c.width/2,y);ctx.fillText(txt,c.width/2,y)}await saveBlob(await canvasBlob(c,'image/jpeg'),'meme.jpg');return}const v=$('#value').value.trim();if($('#mode').value.startsWith('Epoch')){const n=Number(v);if(!Number.isFinite(n))throw new Error('Enter a valid epoch value.');showHtml(`<b>${esc(new Date(n*1000).toISOString())}</b>`)}else{const d=new Date(v);if(Number.isNaN(d.getTime()))throw new Error('Enter a valid date/time.');showHtml(`<b>${Math.floor(d.getTime()/1000)}</b>`)} }catch(e){msg(e.message||String(e))}}
function handle(){const h=location.hash.replace(/^#/,'')||'home';if(h==='home'){ $('#view').innerHTML=home();bindSearch('#homeSearch','#homeTools');return}if(h==='reminder'){$('#view').innerHTML=reminder();setupReminder();return}if(h.startsWith('cat:')){const cat=decodeURIComponent(h.slice(4));$('#view').innerHTML=category(cat);bindSearch('#catSearch','#catTools');return}if(h.startsWith('tool:')){const t=byId[decodeURIComponent(h.slice(5))];if(t)toolPage(t);else location.hash='home';return}location.hash='home'}
window.addEventListener('hashchange',handle);window.addEventListener('load',()=>{handle();setInterval(()=>{for(const t of getTasks()){if(Date.now()>=t.when&&!t.fired){t.fired=true;setTasks(getTasks().map(x=>String(x.id)===String(t.id)?t:x));if('Notification' in window&&Notification.permission==='granted')new Notification(t.title,{body:t.message||'Reminder due'});}}},60000)});
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
