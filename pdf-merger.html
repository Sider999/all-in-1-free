<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online PDF Merger Without Watermark - ToolsPortal</title>
    <meta name="description" content="Merge PDF files online for free without watermark. 100% private, fast, and works directly in your web browser.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600">⚡ ToolsPortal</a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600">← Back to All Tools</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Free Online PDF Merger Without Watermark</h1>
            <p class="text-slate-600">Apni PDF files yahan select karein aur aik file mein merge karein.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <input type="file" id="pdfFileInput" multiple accept="application/pdf" class="hidden" onchange="updateFileList()">
            
            <label for="pdfFileInput" class="border-2 border-dashed border-indigo-200 hover:border-indigo-500 bg-indigo-50/50 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition mb-6">
                <span class="text-3xl mb-2">📄</span>
                <span class="font-semibold text-indigo-600">Choose PDF Files</span>
                <span class="text-xs text-slate-500 mt-1">Select 2 or more PDF documents</span>
            </label>

            <div id="fileList" class="space-y-2 mb-6"></div>

            <button onclick="handleMergeSubmit()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition">
                Merge PDFs & Download
            </button>
        </div>
    </main>

    <script src="portal-core.js"></script>
    <script>
        function updateFileList() {
            const input = document.getElementById('pdfFileInput');
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            Array.from(input.files).forEach((file) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-100 rounded-lg text-sm text-slate-700 flex justify-between items-center';
                item.innerHTML = `<span>${file.name}</span> <span class="text-xs text-slate-400">${(file.size / 1024 / 1024).toFixed(2)} MB</span>`;
                fileList.appendChild(item);
            });
        }

        function handleMergeSubmit() {
            const input = document.getElementById('pdfFileInput');
            processPDFMerge(input.files);
        }
    </script>
</body>
</html>
