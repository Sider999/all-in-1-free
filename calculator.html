<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator - MultiTools</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .calc-screen { width: 100%; height: 60px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #38bdf8; font-size: 1.8rem; text-align: right; padding: 10px 15px; margin-bottom: 20px; outline: none; }
    .calc-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .calc-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 15px; font-size: 1.2rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .calc-btn:hover { background: #334155; }
    .calc-btn.operator { background: #2563eb; }
    .calc-btn.clear { background: #dc2626; }
    .calc-btn.equal { background: #16a34a; grid-column: span 2; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">⚡ MultiTools Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="calculator.html" class="active">Calculator</a></li>
      <li><a href="currency-converter.html">Currencies</a></li>
      <li><a href="reminder.html">Reminders</a></li>
      <li><a href="document-tools.html">PDF & Word</a></li>
      <li><a href="image-tools.html">Image Tools</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="tool-box">
      <h2 class="tool-title">Scientific Calculator</h2>
      <input type="text" id="display" class="calc-screen" readonly value="0">
      
      <div class="calc-btn-grid">
        <button class="calc-btn clear" onclick="clearCalc()">C</button>
        <button class="calc-btn" onclick="backspace()">⌫</button>
        <button class="calc-btn operator" onclick="appendOp('(')">(</button>
        <button class="calc-btn operator" onclick="appendOp(')')">)</button>

        <button class="calc-btn" onclick="appendNum('7')">7</button>
        <button class="calc-btn" onclick="appendNum('8')">8</button>
        <button class="calc-btn" onclick="appendNum('9')">9</button>
        <button class="calc-btn operator" onclick="appendOp('/')">/</button>

        <button class="calc-btn" onclick="appendNum('4')">4</button>
        <button class="calc-btn" onclick="appendNum('5')">5</button>
        <button class="calc-btn" onclick="appendNum('6')">6</button>
        <button class="calc-btn operator" onclick="appendOp('*')">*</button>

        <button class="calc-btn" onclick="appendNum('1')">1</button>
        <button class="calc-btn" onclick="appendNum('2')">2</button>
        <button class="calc-btn" onclick="appendNum('3')">3</button>
        <button class="calc-btn operator" onclick="appendOp('-')">-</button>

        <button class="calc-btn" onclick="appendNum('0')">0</button>
        <button class="calc-btn" onclick="appendNum('.')">.</button>
        <button class="calc-btn operator" onclick="appendOp('+')">+</button>
        <button class="calc-btn operator" onclick="calcFunc('sqrt')">√</button>

        <button class="calc-btn equal" onclick="calculate()">=</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 MultiTools Portal</p>
  </footer>

  <script>
    let display = document.getElementById('display');
    let expr = '';

    function appendNum(num) {
      if (display.value === '0' || display.value === 'Error') expr = '';
      expr += num;
      display.value = expr;
    }

    function appendOp(op) {
      expr += op;
      display.value = expr;
    }

    function clearCalc() { expr = ''; display.value = '0'; }
    function backspace() { expr = expr.slice(0, -1); display.value = expr || '0'; }

    function calcFunc(fn) {
      try {
        if(fn === 'sqrt') {
          let val = eval(expr);
          display.value = Math.sqrt(val);
          expr = display.value;
        }
      } catch (e) { display.value = 'Error'; expr = ''; }
    }

    function calculate() {
      try {
        let result = Function('"use strict";return (' + expr + ')')();
        display.value = result;
        expr = result.toString();
      } catch (e) { display.value = 'Error'; expr = ''; }
    }
  </script>
</body>
</html>
