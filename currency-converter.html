<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Currency Converter - MultiTools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">⚡ MultiTools Portal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="calculator.html">Calculator</a></li>
      <li><a href="currency-converter.html" class="active">Currencies</a></li>
      <li><a href="reminder.html">Reminders</a></li>
      <li><a href="document-tools.html">PDF & Word</a></li>
      <li><a href="image-tools.html">Image Tools</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="tool-box">
      <h2 class="tool-title">Universal Live Currency Converter</h2>

      <label>Amount:</label>
      <input type="number" id="amount" value="100" min="0" oninput="convertCurrency()">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label>From Currency:</label>
          <select id="fromCurrency" onchange="convertCurrency()"></select>
        </div>
        <div>
          <label>To Currency:</label>
          <select id="toCurrency" onchange="convertCurrency()"></select>
        </div>
      </div>

      <div style="background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 12px; margin-top: 25px; text-align: center;">
        <span style="color: #94a3b8; font-size: 0.9rem;">Converted Result</span>
        <h2 id="result" style="color: #38bdf8; font-size: 2.2rem; margin: 10px 0;">0.00</h2>
        <span id="rateInfo" style="color: #64748b; font-size: 0.85rem;">Fetching live market rates...</span>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 MultiTools Portal</p>
  </footer>

  <script>
    let exchangeRates = {};
    const popularCurrencies = ["USD", "PKR", "EUR", "GBP", "SAR", "AED", "INR", "CAD", "AUD", "JPY", "CNY", "TRY", "KWD", "QAR"];

    async function fetchRates() {
      try {
        let res = await fetch("https://open.er-api.com/v6/latest/USD");
        let data = await res.json();
        exchangeRates = data.rates;
        populateCurrencyDropdowns();
        convertCurrency();
      } catch (err) {
        document.getElementById('rateInfo').innerText = "Offline Mode: Rates updated using cached estimates.";
        exchangeRates = { "USD": 1, "PKR": 278.5, "EUR": 0.92, "GBP": 0.78, "SAR": 3.75, "AED": 3.67, "INR": 83.5, "CAD": 1.36, "AUD": 1.52 };
        populateCurrencyDropdowns();
        convertCurrency();
      }
    }

    function populateCurrencyDropdowns() {
      let fromSel = document.getElementById('fromCurrency');
      let toSel = document.getElementById('toCurrency');
      fromSel.innerHTML = ''; toSel.innerHTML = '';

      let keys = Object.keys(exchangeRates).sort();
      keys.forEach(code => {
        let opt1 = document.createElement('option'); opt1.value = code; opt1.innerText = code;
        let opt2 = document.createElement('option'); opt2.value = code; opt2.innerText = code;
        fromSel.appendChild(opt1);
        toSel.appendChild(opt2);
      });

      fromSel.value = "USD";
      toSel.value = "PKR";
    }

    function convertCurrency() {
      let amt = parseFloat(document.getElementById('amount').value) || 0;
      let from = document.getElementById('fromCurrency').value;
      let to = document.getElementById('toCurrency').value;

      if (!exchangeRates[from] || !exchangeRates[to]) return;

      let inUSD = amt / exchangeRates[from];
      let converted = inUSD * exchangeRates[to];

      document.getElementById('result').innerText = converted.toFixed(2) + " " + to;
      let rate = (exchangeRates[to] / exchangeRates[from]).toFixed(4);
      document.getElementById('rateInfo').innerText = `1 ${from} = ${rate} ${to} (Live API Rate)`;
    }

    document.addEventListener("DOMContentLoaded", fetchRates);
  </script>
</body>
</html>
